<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fusen</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="application-name" content="Fusen">
<meta name="apple-mobile-web-app-title" content="Fusen">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F8F7F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#222120" media="(prefers-color-scheme: dark)">
<style>html{color-scheme:light}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Klee+One:wght@400;600&family=M+PLUS+1+Code:wght@400;500;700&family=Shippori+Mincho:wght@600;700&display=swap">
<style>
/* Layout: macOS-style source list | toolbar + board/list canvas | slide-in day timeline */
:root{
  --board:#ECEAE5; --dots:rgba(60,52,40,.14); --win:#F8F7F4; --side:rgba(233,231,226,.82);
  --ink:#1E1D1A; --ink2:#67635B; --ink3:#9A958B; --line:rgba(50,44,32,.10); --line2:rgba(50,44,32,.18);
  --accent:#3A6BD6; --accent-bg:rgba(58,107,214,.12); --sel:rgba(50,44,32,.08); --now:#E0483F;
  --pop:#FFFFFF; --tl:#FBFAF8; --clipbg:#E6D7BE; --scrim:rgba(30,26,20,.28); --stk-filter:none;
  --shadow-pop:0 18px 48px -12px rgba(40,30,10,.28),0 2px 6px rgba(40,30,10,.08);
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --f-note:"Hiragino Maru Gothic ProN","Zen Maru Gothic","Hiragino Sans",var(--f-ui);
  --f-num:"SF Mono",ui-monospace,Menlo,monospace;
  --f-kaku:"Zen Kaku Gothic New",var(--f-ui);--f-hand:"Klee One","Hiragino Maru Gothic ProN",sans-serif;--f-code:"M PLUS 1 Code",ui-monospace,Menlo,monospace;--f-min:"Shippori Mincho","Hiragino Mincho ProN",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --board:#1B1A18; --dots:rgba(255,248,232,.07); --win:#222120; --side:rgba(38,36,33,.86);
  --ink:#EEECE7; --ink2:#A9A59C; --ink3:#78746C; --line:rgba(255,248,232,.08); --line2:rgba(255,248,232,.15);
  --accent:#7AA2F7; --accent-bg:rgba(122,162,247,.16); --sel:rgba(255,248,232,.08); --now:#FF6B5E;
  --pop:#2B2A27; --tl:#242321; --clipbg:#4A4236; --scrim:rgba(0,0,0,.5); --stk-filter:brightness(.9) saturate(.92);
  --shadow-pop:0 18px 48px -12px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --board:#1B1A18; --dots:rgba(255,248,232,.07); --win:#222120; --side:rgba(38,36,33,.86);
  --ink:#EEECE7; --ink2:#A9A59C; --ink3:#78746C; --line:rgba(255,248,232,.08); --line2:rgba(255,248,232,.15);
  --accent:#7AA2F7; --accent-bg:rgba(122,162,247,.16); --sel:rgba(255,248,232,.08); --now:#FF6B5E;
  --pop:#2B2A27; --tl:#242321; --clipbg:#4A4236; --scrim:rgba(0,0,0,.5); --stk-filter:brightness(.9) saturate(.92);
  --shadow-pop:0 18px 48px -12px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.3); color-scheme:dark}

.c-lemon{--s:#FFE48C;--si:#4F3D00;--sd:#E0B41E}
.c-mint{--s:#BFEBD3;--si:#0B4730;--sd:#34B37A}
.c-rose{--s:#FBD0DC;--si:#6A1C36;--sd:#E0668C}
.c-sky{--s:#C8DFFA;--si:#10396A;--sd:#4A8BE0}
.c-lilac{--s:#DDD3FA;--si:#35287A;--sd:#8B72E6}
.c-peach{--s:#FFD4B8;--si:#652A0B;--sd:#EE8A4E}
.c-sage{--s:#DDE7C2;--si:#374710;--sd:#8BA33A}
.c-paper{--s:#F4F1E9;--si:#3A3832;--sd:#A8A397}

html,body{height:100%}
body{background:var(--win);color:var(--ink);font-family:var(--f-ui);font-size:13px;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.app{display:grid;grid-template-columns:268px minmax(0,1fr);height:100%}

/* sidebar */
.side{background:var(--side);padding-inline:8px!important;backdrop-filter:blur(30px) saturate(1.4);-webkit-backdrop-filter:blur(30px) saturate(1.4);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px 10px;gap:2px;overflow-y:auto;min-height:0}
.brand{display:flex;align-items:center;gap:8px;padding:2px 8px 14px;font-weight:600;font-size:14px;letter-spacing:.01em}
.brand i{width:18px;height:18px;border-radius:5px;background:#FFE48C;box-shadow:inset 0 -5px 0 rgba(0,0,0,.06),2px 2px 0 -1px #BFEBD3,4px 4px 0 -2px #FBD0DC;transform:rotate(-6deg)}
.cap{font-size:11px;font-weight:600;color:var(--ink3);padding:14px 8px 5px;letter-spacing:.02em;display:flex;justify-content:space-between;align-items:center}
.cap button{color:var(--ink3);display:flex;border-radius:5px;padding:2px}
.cap-b{display:flex;gap:4px;align-items:center}
.cap button:hover{color:var(--ink);background:var(--sel)}
.nav{display:flex;align-items:center;gap:9px;width:100%;padding:6px 8px;border-radius:7px;color:var(--ink);text-align:left;position:relative;transition:background .15s,box-shadow .15s}
.nav:hover{background:var(--sel)}
.nav.on{background:var(--accent-bg);color:var(--accent)}
.nav .n{margin-left:auto;font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.nav.on .n{color:var(--accent)}
.nav small{display:block;font-size:10.5px;color:var(--ink3);margin-top:1px}
.nav .lbl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav.drop-hot{background:var(--accent);color:#fff;box-shadow:0 0 0 3px var(--accent-bg);transform:scale(1.02)}
.nav.drop-hot .n,.nav.drop-hot small{color:#fff}
.dot{width:10px;height:10px;border-radius:3px;background:var(--sd);flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.nav.area.on{background:var(--sel);color:var(--ink)}
.side-foot{margin-top:auto;padding:12px 8px 2px;font-size:11px;color:var(--ink3);display:flex;flex-direction:column;gap:6px}
.side-foot button{color:var(--accent);text-align:left}
.area-add{display:flex;gap:6px;padding:4px 6px}
.area-add input{flex:1;min-width:0;border:1px solid var(--line2);background:var(--pop);border-radius:6px;padding:4px 7px;font-size:12px}

/* main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--win);flex-wrap:wrap;position:relative;z-index:5}
.bar h1{font-size:17px;font-weight:700;margin:0;letter-spacing:.01em;display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.bar h1 span{font-size:12px;font-weight:500;color:var(--ink3);font-variant-numeric:tabular-nums}
.menu-btn,.bar .menu-btn{display:none}
.seg{display:flex;background:var(--sel);border-radius:8px;padding:2px}
.seg button{display:flex;align-items:center;gap:5px;padding:4px 9px;border-radius:6px;color:var(--ink2);font-size:12px}
.seg button.on{background:var(--pop);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.spacer{flex:1}
.iconbtn{display:flex;align-items:center;justify-content:center;gap:5px;height:28px;min-width:28px;padding:0 8px;border-radius:7px;color:var(--ink2)}
.iconbtn:hover{background:var(--sel);color:var(--ink)}
.iconbtn.on{background:var(--accent);color:#fff}
.bodyrow{flex:1;display:flex;min-height:0}
.content{flex:1;min-width:0;position:relative;display:flex}

/* board */
.board-scroll{flex:1;overflow:auto;background:var(--board);position:relative}
.canvas{position:relative;background-image:radial-gradient(var(--dots) 1.1px,transparent 1.3px);background-size:calc(24px*var(--z)) calc(24px*var(--z))}
.plane{position:absolute;left:0;top:0;transform-origin:0 0}
.stk{position:absolute;width:176px;padding:12px 13px 10px;border-radius:2px 2px 3px 14px/2px 2px 3px 8px;background:var(--s);color:var(--si);
  background-image:linear-gradient(180deg,rgba(0,0,0,.045),rgba(0,0,0,0) 26px),linear-gradient(135deg,rgba(255,255,255,.35),rgba(255,255,255,0) 40%);
  filter:var(--stk-filter);box-shadow:var(--layers,0 0 0 0 transparent),0 1px 1px rgba(40,30,0,.10),0 10px 16px -10px rgba(50,35,0,.35),0 2px 4px -2px rgba(50,35,0,.12);
  transform:rotate(var(--r));transition:transform .28s cubic-bezier(.2,.9,.3,1.25),box-shadow .2s,opacity .28s;
  display:flex;flex-direction:column;gap:6px;cursor:grab;user-select:none;touch-action:none;font-family:var(--f-note)}
.stk::after{content:"";position:absolute;right:0;bottom:0;width:22px;height:22px;background:linear-gradient(315deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.07) 50%,rgba(255,255,255,.3) 56%,rgba(0,0,0,0) 70%);border-radius:0 0 3px 0;pointer-events:none}
.stk:hover{transform:rotate(calc(var(--r)*.4)) translateY(-2px);box-shadow:var(--layers,0 0 0 0 transparent),0 1px 1px rgba(40,30,0,.10),0 16px 22px -12px rgba(50,35,0,.42),0 3px 6px -2px rgba(50,35,0,.14);z-index:2}
.stk-top{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-ui);font-size:10.5px;font-weight:600;opacity:.62;letter-spacing:.03em}
.stk-min{font-family:var(--f-num);font-size:10.5px;letter-spacing:0;font-weight:500;display:flex;align-items:center;gap:3px}
.stk-min svg.i{width:11px;height:11px}
.stk-title{font-size:15px;font-weight:700;line-height:1.38;word-break:break-word;text-wrap:pretty;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;flex:none}
.stk-note{flex:none;font-size:12px;line-height:1.5;opacity:.78;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stk-wait{font-family:var(--f-ui);font-size:11px;opacity:.75;display:flex;gap:4px;align-items:center}
.stk-foot{margin-top:auto;display:flex;align-items:flex-end;gap:6px;padding-top:4px}
.stk-tags{display:flex;flex-wrap:wrap;gap:4px;flex:1}
.stk-tags span{font-family:var(--f-ui);font-size:10px;font-weight:600;padding:2px 6px;border-radius:99px;background:rgba(0,0,0,.07)}
.chk{width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;opacity:.45;flex:none;display:flex;align-items:center;justify-content:center;transition:opacity .15s,background .15s}
.chk svg.i{width:12px;height:12px;stroke-width:2.4;opacity:0}
.chk:hover{opacity:1;background:rgba(255,255,255,.35)}
/* 完了の当たり判定を見た目より広く（約46px） */
.stk .chk,.row .chk{position:relative}
.stk .chk::before{content:'';position:absolute;inset:-13px;border-radius:6px}
.row .chk::before{content:'';position:absolute;inset:-9px;border-radius:10px}
.chk:hover svg.i{opacity:.7}
.stk.gone{opacity:0;transform:rotate(var(--r)) scale(.8) translateY(8px);pointer-events:none;visibility:hidden;transition:opacity .22s,transform .22s,visibility 0s .22s}
.stk.src-hidden{opacity:0;transition:none}
.stk.new{animation:pop .45s cubic-bezier(.2,.9,.3,1.4)}
@keyframes pop{from{transform:rotate(var(--r)) scale(.4);opacity:0}}
.board-empty{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);text-align:center;color:var(--ink3);pointer-events:none;font-size:13px;line-height:1.7}
.board-empty b{display:block;font-family:var(--f-note);font-size:17px;color:var(--ink2);margin-bottom:4px}

/* crumple */
.crumple{animation:crumple .7s cubic-bezier(.5,0,.75,0) forwards!important;pointer-events:none;z-index:50}
.crumple::before{content:"";position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(62deg,rgba(0,0,0,0) 0 9px,rgba(0,0,0,.09) 10px,rgba(255,255,255,.25) 11px,rgba(0,0,0,0) 12px 20px),repeating-linear-gradient(-38deg,rgba(0,0,0,0) 0 13px,rgba(0,0,0,.08) 14px,rgba(0,0,0,0) 15px 26px);opacity:0;animation:creases .7s forwards}
@keyframes crumple{
  0%{transform:rotate(var(--r)) scale(1);border-radius:3px}
  22%{transform:rotate(calc(var(--r) + 5deg)) scale(.96,.9) skewX(3deg);border-radius:10px 22px 8px 18px}
  48%{transform:rotate(calc(var(--r) - 14deg)) scale(.62,.58) skewY(-5deg);border-radius:38% 46% 40% 44%}
  72%{transform:rotate(calc(var(--r) + 40deg)) scale(.34);border-radius:50%;opacity:1}
  100%{transform:rotate(calc(var(--r) + 120deg)) scale(.04) translateY(60px);border-radius:50%;opacity:0}}
@keyframes creases{0%{opacity:0}25%{opacity:.8}100%{opacity:1}}
.crumple>*{animation:squish .5s forwards}
@keyframes squish{to{opacity:0;filter:blur(1.5px)}}

/* list */
.list-scroll{flex:1;overflow:auto;background:var(--win)}
.list{max-width:760px;margin:0 auto;padding:18px 20px 80px}
.lgroup{margin-bottom:22px}
.lgroup h3{font-size:12px;font-weight:600;color:var(--ink2);margin:0 0 6px;display:flex;align-items:center;gap:8px;padding:0 6px}
.lgroup h3 span{color:var(--ink3);font-weight:500;font-variant-numeric:tabular-nums;margin-left:auto}
.row.src-hidden{opacity:.3}
.empty-list{color:var(--ink3);text-align:center;padding:60px 20px;line-height:1.8}
.empty-list b{display:block;font-family:var(--f-note);font-size:17px;color:var(--ink2)}

/* log */
.logday h3{font-size:12px;font-weight:600;color:var(--ink2);margin:0 0 6px;padding:0 6px;display:flex}
.logday h3 span{margin-left:auto;color:var(--ink3);font-weight:500;font-variant-numeric:tabular-nums}
.logrow{display:flex;align-items:center;gap:11px;padding:8px 10px;border-bottom:1px solid var(--line)}
.logrow .ok{width:18px;height:18px;border-radius:50%;background:var(--sd);filter:var(--stk-filter);display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.logrow .ok svg.i{width:11px;height:11px;stroke-width:2.6}
.logrow b{font-weight:500;flex:1;min-width:0;color:var(--ink2);text-decoration:line-through;text-decoration-color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logrow time{font-family:var(--f-num);font-size:11px;color:var(--ink3)}
.logrow button{font-size:11.5px;color:var(--accent);padding:2px 6px;border-radius:5px}
.logrow button:hover{background:var(--accent-bg)}
.log-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:24px}
.log-sum div{background:var(--sel);border-radius:10px;padding:12px 14px}
.log-sum small{display:block;color:var(--ink3);font-size:11px;margin-bottom:3px}
.log-sum b{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}

/* timeline */
.tl{width:0;overflow:hidden;background:var(--tl);border-left:1px solid transparent;display:flex;flex-direction:column;transition:width .38s cubic-bezier(.3,.8,.2,1),border-color .38s;flex:none;position:relative;z-index:4}
.tl.open{width:268px;border-left-color:var(--line)}
.tl-inner{width:268px;display:flex;flex-direction:column;height:100%}
.tl-head{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.tl-head .d{display:flex;align-items:baseline;justify-content:space-between}
.tl-head b{font-size:15px;font-weight:700}
.tl-head .d span{font-size:11.5px;color:var(--ink3)}
.meter{height:5px;border-radius:9px;background:var(--sel);margin-top:10px;overflow:hidden;display:flex}
.meter i{display:block;height:100%;background:var(--sd);filter:var(--stk-filter)}
.tl-sum{display:flex;justify-content:space-between;font-size:11px;color:var(--ink2);margin-top:6px;font-variant-numeric:tabular-nums}
.tl-scroll{flex:1;overflow-y:auto;position:relative;scroll-behavior:auto}
.tl-day{position:relative}
.hour{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.hour span{position:absolute;left:10px;top:-7px;font-family:var(--f-num);font-size:10.5px;color:var(--ink3);background:var(--tl);padding:0 4px;font-variant-numeric:tabular-nums}
.half{position:absolute;left:48px;right:0;border-top:1px dashed var(--line2)}
.tick{position:absolute;left:52px;right:0;border-top:1px dotted var(--line)}
.tick span,.half span{position:absolute;left:-26px;top:-6px;font-family:var(--f-num);font-size:9px;color:var(--ink3);opacity:.75;font-variant-numeric:tabular-nums}
.half span{left:-30px;opacity:1}
.tl-blocks{position:absolute;left:54px;right:10px;top:0;bottom:0}
.now{position:absolute;left:44px;right:0;height:0;border-top:2px solid var(--now);z-index:3;pointer-events:none}
.now::before{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--now)}
.now span{position:absolute;right:8px;top:-17px;font-family:var(--f-num);font-size:10px;color:var(--now);font-weight:600}
.past{position:absolute;left:0;right:0;top:0;background:repeating-linear-gradient(135deg,transparent 0 6px,var(--sel) 6px 7px);opacity:.5;pointer-events:none}
.blk{position:absolute;box-sizing:border-box;border-radius:3px 3px 4px 9px/3px 3px 4px 6px;background:var(--s);color:var(--si);filter:var(--stk-filter);padding:5px 8px;overflow:hidden;cursor:grab;touch-action:none;user-select:none;
  background-image:linear-gradient(180deg,rgba(0,0,0,.045),rgba(0,0,0,0) 14px),linear-gradient(135deg,rgba(255,255,255,.35),rgba(255,255,255,0) 40%);
  box-shadow:0 1px 1px rgba(40,30,0,.10),0 6px 10px -7px rgba(50,35,0,.35);display:flex;gap:7px;align-items:flex-start;transition:opacity .2s,box-shadow .15s;font-family:var(--f-note)}
.blk:hover{box-shadow:0 1px 1px rgba(40,30,0,.10),0 10px 16px -8px rgba(50,35,0,.42)}
.blk .chk{width:16px;height:16px;margin-top:1px}
.blk .chk svg.i{width:10px;height:10px}
.blk .bt{min-width:0;flex:1}
.blk b{display:block;font-size:12.5px;font-weight:700;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk time{display:block;font-family:var(--f-num);font-size:10px;opacity:.7;margin-top:1px}
.blk.short{align-items:center;padding-block:0}
.blk.short time{display:none}
.blk .rsz{position:absolute;left:0;right:0;bottom:0;height:7px;cursor:ns-resize}
.blk .rsz::after{content:"";position:absolute;left:50%;bottom:2px;width:22px;height:3px;margin-left:-11px;border-radius:3px;background:currentColor;opacity:0;transition:opacity .15s}
.blk:hover .rsz::after{opacity:.3}
.blk.src-hidden{opacity:.28}
.blk.done-blk{opacity:.5}
.blk.done-blk b{text-decoration:line-through}
.tl-hint{position:absolute;left:54px;right:10px;border:1.5px dashed var(--accent);border-radius:8px;background:var(--accent-bg);pointer-events:none;display:none}
.tl.drop-on .tl-scroll{background:linear-gradient(var(--accent-bg),var(--accent-bg))}

/* ghost */
.ghost{position:fixed!important;left:0;top:0;z-index:1000;pointer-events:none;margin:0;transform-origin:0 0;
  transform:scale(var(--gz,1)) rotate(-1deg);box-shadow:0 2px 3px rgba(40,30,0,.12),0 26px 40px -16px rgba(40,30,0,.5)!important;
  transition:width .2s cubic-bezier(.3,.8,.2,1),height .2s cubic-bezier(.3,.8,.2,1),border-radius .2s,transform .2s,padding .2s}
.ghost.in-tl{transition:left .1s,top .1s,width .2s cubic-bezier(.3,.8,.2,1),height .2s cubic-bezier(.3,.8,.2,1),border-radius .2s,transform .2s,padding .2s}
.ghost{box-sizing:border-box}

/* pads & draft */
.view{flex:1;display:flex;min-width:0;min-height:0;position:relative}
.pads{flex:none;width:72px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:26px;padding:16px 0 26px;background:var(--win);border-right:1px solid var(--line);overflow-y:auto;scrollbar-width:none;position:relative;z-index:3}
.pad{--s2:color-mix(in srgb,var(--s) 88%,#7a5a2a);--s3:color-mix(in srgb,var(--s) 78%,#7a5a2a);--edge:rgba(60,40,0,.18);width:44px;height:44px;flex:none;position:relative;cursor:grab;touch-action:none;border-radius:2px 2px 2px 7px;background:var(--s);filter:var(--stk-filter);
  background-image:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,0) 10px);
  box-shadow:2px 2px 0 -.5px var(--s2),2px 2px 0 .5px var(--edge),4px 4px 0 -1px var(--s3),4px 4px 0 0 var(--edge),6px 6px 0 -1.5px var(--s3),6px 6px 0 -.5px var(--edge),0 8px 10px -6px rgba(50,35,0,.45);transition:transform .18s cubic-bezier(.2,.9,.3,1.4)}
.pad::after{content:"";position:absolute;right:0;bottom:0;width:12px;height:12px;background:linear-gradient(315deg,transparent 45%,rgba(0,0,0,.08) 50%,rgba(255,255,255,.4) 58%,transparent 72%);transition:all .18s}
.pad:hover{transform:translateY(-2px) rotate(-4deg)}
.pad:hover::after{width:20px;height:20px}
.pad:active{cursor:grabbing}
.pad span{position:absolute;top:52px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--ink2);white-space:nowrap;max-width:60px;overflow:hidden;text-overflow:ellipsis;filter:none}
.stk.draft{cursor:text;box-shadow:var(--layers,0 0 0 0 transparent),0 0 0 2px color-mix(in srgb,var(--sd) 55%,transparent),0 18px 28px -14px rgba(50,35,0,.5)}
.stk.draft:hover{transform:rotate(var(--r))}
.draft-title{border:0;background:transparent;resize:none;outline:none;font-family:var(--f-note);font-size:15px;font-weight:700;line-height:1.38;color:inherit;width:100%;padding:0;min-height:44px;overflow:hidden}
.draft-title::placeholder{color:currentColor;opacity:.4}
.stk.settle{animation:settle .35s ease-out}
@keyframes settle{from{transform:rotate(var(--r)) translateY(-3px) scale(1.02)}}
.tray{position:fixed;z-index:950;width:286px;background:var(--pop);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow-pop);padding:10px 12px 8px;display:flex;flex-direction:column;gap:8px;font-size:11.5px;animation:rise .22s cubic-bezier(.2,.9,.3,1.1)}
.tr{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.tr>b{font-weight:600;color:var(--ink3);font-size:10.5px;width:30px;flex:none}
.tr .c{display:flex;align-items:center;gap:4px;padding:3px 8px;border-radius:99px;border:1px solid var(--line2);color:var(--ink2);font-size:11px}
.tr .c svg.i{width:12px;height:12px}
.tr .c:hover{color:var(--ink);border-color:var(--ink3)}
.tr .c.on{background:var(--ink);color:var(--win);border-color:var(--ink)}
.tr-foot{display:flex;justify-content:space-between;color:var(--ink3);font-size:10.5px;border-top:1px solid var(--line);padding-top:6px}
@media (max-width:760px){.pads{width:60px}}
/* ================= sticky styles (settings) ================= */
body{--mn-bg:#FFFFFF;--mn-ink:#1C1C1E;--mn-line:#E3E2DE;--mn-chip:#F2F1ED;--fl-bg:#FFFFFF;--fl-ink:#222;--gl-card:rgba(255,255,255,.36);--gl-ink:#1D1B2A;--gl-edge:rgba(255,255,255,.75);--g1:rgba(255,160,190,.85);--g2:rgba(140,200,255,.85);--g3:rgba(255,220,130,.85)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body{--mn-bg:#26262A;--mn-ink:#ECECEE;--mn-line:#38383C;--mn-chip:#303034;--fl-bg:#2B2A27;--fl-ink:#EEE;--gl-card:rgba(40,40,56,.5);--gl-ink:#ECEAF6;--gl-edge:rgba(255,255,255,.18);--g1:rgba(150,50,100,.55);--g2:rgba(40,90,160,.55);--g3:rgba(150,110,30,.5)}
  :root:not([data-theme="light"]) body.bd-custom{--board:var(--board-d)}}
:root[data-theme="dark"] body{--mn-bg:#26262A;--mn-ink:#ECECEE;--mn-line:#38383C;--mn-chip:#303034;--fl-bg:#2B2A27;--fl-ink:#EEE;--gl-card:rgba(40,40,56,.5);--gl-ink:#ECEAF6;--gl-edge:rgba(255,255,255,.18);--g1:rgba(150,50,100,.55);--g2:rgba(40,90,160,.55);--g3:rgba(150,110,30,.5)}
:root[data-theme="dark"] body.bd-custom{--board:var(--board-d)}

.stk-title span{-webkit-box-decoration-break:clone;box-decoration-break:clone}
.draft-title{font-family:inherit}
body:not(.sty-classic) .stk:not(.as-block)::after{display:none}
body:not(.sty-classic) .stk:not(.as-block){background-image:none}
body:not(.sty-classic) .stk.soft:not(.as-block){opacity:.8}

/* tape */
body.sty-tape .stk:not(.as-block){background:#FFFDF7;color:#2A2723;font-family:var(--f-kaku);border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 12px 18px -12px rgba(0,0,0,.38);padding-top:22px;filter:var(--stk-filter)}
body.sty-tape .stk:not(.as-block):not(.crumple)::before{content:"";position:absolute;top:-10px;left:50%;width:80px;height:24px;margin-left:-40px;background:color-mix(in srgb,var(--sd) 55%,transparent);background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.2) 0 3px,transparent 3px 7px);transform:rotate(-4deg);clip-path:polygon(3% 0,97% 4%,100% 22%,96% 40%,100% 60%,97% 80%,99% 100%,2% 96%,0 78%,3% 58%,0 40%,4% 20%);mix-blend-mode:multiply;pointer-events:none}
body.sty-tape .stk .stk-top{opacity:1;color:color-mix(in srgb,var(--sd) 75%,#000)}
body.sty-tape .stk .stk-tags span{background:#F1EEE6}

/* glass */
body.sty-glass .stk:not(.as-block){background:color-mix(in srgb,var(--s) 30%,var(--gl-card));-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);border:1px solid var(--gl-edge);border-radius:16px;color:var(--gl-ink);font-family:var(--f-kaku);box-shadow:0 10px 28px -12px rgba(40,30,90,.45),inset 0 1px 0 var(--gl-edge);filter:none}
body.sty-glass .stk .stk-top{opacity:.8}
body.sty-glass .stk .stk-tags span{background:rgba(255,255,255,.35)}

/* minimal */
body.sty-minimal .stk{--r:0deg!important}
body.sty-minimal .stk:not(.as-block){background:var(--mn-bg);color:var(--mn-ink);border:1px solid var(--mn-line);border-radius:12px;font-family:var(--f-kaku);box-shadow:0 1px 2px rgba(0,0,0,.05);filter:none}
body.sty-minimal .stk:not(.as-block):hover{box-shadow:0 8px 18px -10px rgba(0,0,0,.3)}
body.sty-minimal .stk .stk-top{opacity:.7}
body.sty-minimal .stk .stk-where::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--sd);margin-right:3px;flex:none}
body.sty-minimal .stk .stk-title{font-weight:500}
body.sty-minimal .stk .stk-tags span{background:var(--mn-chip)}

/* film flags */
body.sty-flag .stk:not(.as-block){width:228px;min-height:50px!important;height:auto!important;padding:8px 36px 8px 58px;justify-content:center;gap:2px;border-radius:3px 6px 6px 3px;background:linear-gradient(90deg,color-mix(in srgb,var(--sd) 65%,transparent) 0 48px,var(--fl-bg) 48px);color:var(--fl-ink);font-family:var(--f-kaku);box-shadow:0 1px 2px rgba(0,0,0,.14),0 6px 12px -8px rgba(0,0,0,.3);filter:none}
body.sty-flag .stk .stk-top{position:absolute;left:0;top:0;bottom:0;width:48px;flex-direction:column;justify-content:center;gap:1px;color:#fff;opacity:1;padding:0 3px;box-sizing:border-box;font-size:9px}
body.sty-flag .stk .stk-where{max-width:42px;font-size:9px}
body.sty-flag .stk .stk-where svg.i{display:none}
body.sty-flag .stk .stk-min{font-size:9px;color:#fff}
body.sty-flag .stk .stk-min svg.i{display:none}
body.sty-flag .stk .stk-title{font-size:13px;font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
body.sty-flag .stk .stk-note,body.sty-flag .stk .stk-tags,body.sty-flag .stk .stk-wait,body.sty-flag .stk .stk-prog{display:none}
body.sty-flag .stk .stk-foot{position:absolute;right:8px;top:50%;margin-top:-10px;padding:0}
body.sty-flag .stk.draft .draft-title{font-size:13px;min-height:20px}

/* grid notebook */
body.sty-grid .stk:not(.as-block){background-color:#FFFFFB;background-image:linear-gradient(#DCE7F0 1px,transparent 1px),linear-gradient(90deg,#DCE7F0 1px,transparent 1px);background-size:12px 12px;padding-left:28px;color:#23303A;font-family:var(--f-hand);border-radius:2px;box-shadow:0 10px 16px -12px rgba(20,40,60,.45);filter:var(--stk-filter)}
body.sty-grid .stk:not(.as-block):not(.crumple)::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:10px;background:radial-gradient(circle at 5px 9px,var(--board) 3.2px,transparent 3.7px) 0 0/10px 18px repeat-y;pointer-events:none}
body.sty-grid .stk .stk-title{font-weight:600}
body.sty-grid .stk .stk-title span{background:linear-gradient(transparent 64%,color-mix(in srgb,var(--sd) 45%,transparent) 64% 96%,transparent 96%)}
body.sty-grid .stk .stk-top{color:var(--sd);opacity:1}
body.sty-grid .stk .stk-tags span{background:rgba(35,48,58,.06)}

/* ticket */
body.sty-ticket .stk:not(.as-block){background:var(--s);background-image:linear-gradient(90deg,transparent calc(100% - 44px),#FFFDF6 calc(100% - 44px));color:var(--si);font-family:var(--f-kaku);border-radius:7px;padding-right:56px;box-shadow:0 14px 22px -12px rgba(0,0,0,.55);filter:var(--stk-filter)}
body.sty-ticket .stk:not(.as-block):not(.crumple)::before,body.sty-ticket .stk:not(.as-block)::after{content:"";display:block;position:absolute;right:36px;width:16px;height:16px;border-radius:50%;background:var(--board);pointer-events:none}
body.sty-ticket .stk:not(.as-block)::before{top:-8px}
body.sty-ticket .stk:not(.as-block)::after{bottom:-8px;top:auto;left:auto;background-image:none}
body.sty-ticket .stk .stk-min{position:absolute;right:0;top:0;bottom:0;width:44px;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;font-family:var(--f-code);font-size:12.5px;font-weight:700;border-left:1.5px dashed color-mix(in srgb,var(--sd) 55%,transparent);color:var(--si);letter-spacing:.08em;opacity:.85}
body.sty-ticket .stk .stk-min svg.i{display:none}

/* polaroid */
body.sty-pola .stk:not(.as-block){background:#FFFFFD;color:#333;padding:9px 9px 10px;border-radius:1px;font-family:var(--f-hand);box-shadow:0 2px 3px rgba(0,0,0,.12),0 14px 20px -12px rgba(0,0,0,.45);filter:var(--stk-filter)}
body.sty-pola .stk .stk-title,body.sty-pola .stk .draft-title{order:-1;background:var(--s);color:var(--si);min-height:74px;padding:10px;box-sizing:border-box;font-family:var(--f-note);font-size:14px;display:flex;align-items:flex-end}
body.sty-pola .stk .draft-title{display:block}
body.sty-pola .stk .stk-top{opacity:.75;color:#555}
body.sty-pola .stk .stk-tags span{background:#F1F0EC}

/* receipt */
body.sty-receipt .stk:not(.as-block){background:#FBFAF6;color:#2A2A2A;font-family:var(--f-code);border-radius:0;padding-bottom:20px;box-shadow:0 12px 18px -12px rgba(0,0,0,.45);filter:var(--stk-filter)}
body.sty-receipt .stk:not(.as-block):not(.crumple)::before{content:"";position:absolute;left:0;right:0;bottom:-1px;height:10px;background:linear-gradient(-45deg,var(--board) 6px,transparent 0),linear-gradient(45deg,var(--board) 6px,transparent 0);background-size:12px 12px;background-position:left bottom;background-repeat:repeat-x;pointer-events:none}
body.sty-receipt .stk .stk-top{opacity:1;border-bottom:1px dashed #999;padding-bottom:5px}
body.sty-receipt .stk .stk-where{color:var(--sd);letter-spacing:.12em}
body.sty-receipt .stk .stk-title{font-family:var(--f-kaku);font-size:14px}
body.sty-receipt .stk .stk-foot{border-top:1px dashed #999;padding-top:6px}
body.sty-receipt .stk .stk-tags span{background:none;border:1px solid #bbb;border-radius:3px}

/* index card */
body.sty-index .stk:not(.as-block){background-color:#FFFEFA;background-image:linear-gradient(#E25B5B,#E25B5B),repeating-linear-gradient(transparent 0 19px,#BFD4EE 19px 20px);background-size:100% 1.5px,100% calc(100% - 38px);background-position:0 30px,0 33px;background-repeat:no-repeat;color:#1F2530;font-family:var(--f-kaku);border-radius:2px;border-top:6px solid var(--sd);padding-top:9px;box-shadow:0 2px 3px rgba(0,0,0,.2),0 12px 16px -10px rgba(0,0,0,.45);filter:var(--stk-filter)}
body.sty-index .stk:not(.as-block):not(.crumple)::before{content:"";position:absolute;top:-5px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8f86,#c22f25 60%,#8c1a12);box-shadow:0 3px 3px rgba(0,0,0,.35);pointer-events:none}
body.sty-index .stk .stk-top{font-family:var(--f-code);opacity:.6;margin-bottom:5px}
body.sty-index .stk .stk-title{line-height:20px;font-size:14px}
body.sty-index .stk .stk-note{line-height:20px}

/* ---- area colour mode ---- */
body.cm-full:not(.sty-classic):not(.sty-glass):not(.sty-ticket):not(.sty-flag) .stk:not(.as-block){background-color:color-mix(in srgb,var(--s) 72%,#FFFDF8)!important}
body.cm-full.sty-flag .stk:not(.as-block){background:linear-gradient(90deg,color-mix(in srgb,var(--sd) 65%,transparent) 0 48px,color-mix(in srgb,var(--s) 65%,var(--fl-bg)) 48px)!important}
body.cm-full.sty-glass .stk:not(.as-block){background:color-mix(in srgb,var(--s) 60%,var(--gl-card))!important}
body.cm-accent.sty-classic .stk:not(.as-block),body.cm-accent.sty-ticket .stk:not(.as-block){background-color:color-mix(in srgb,var(--s) 22%,#FFFDF8)!important;border-top:5px solid var(--sd)}
body.cm-accent.sty-pola .stk .stk-title,body.cm-accent.sty-pola .stk .draft-title{background:color-mix(in srgb,var(--s) 25%,#FFFDF8)!important;box-shadow:inset 0 -3px 0 var(--sd)}
body.cm-accent.sty-glass .stk:not(.as-block){background:color-mix(in srgb,var(--s) 10%,var(--gl-card))!important}

/* ---- title font ---- */
body.fn-goth .stk .stk-title,body.fn-goth .stk .draft-title{font-family:var(--f-kaku)!important}
body.fn-maru .stk .stk-title,body.fn-maru .stk .draft-title{font-family:var(--f-note)!important}
body.fn-hand .stk .stk-title,body.fn-hand .stk .draft-title{font-family:var(--f-hand)!important}
body.fn-min .stk .stk-title,body.fn-min .stk .draft-title{font-family:var(--f-min)!important}

/* ---- tilt ---- */
body.tilt-0 .stk{--r:0deg!important}

/* ---- boards ---- */
body.bd-grid .canvas{background-image:linear-gradient(var(--dots) 1px,transparent 1px),linear-gradient(90deg,var(--dots) 1px,transparent 1px)}
body.bd-plain .canvas{background-image:none}
body.bd-cork{--board:#B98A55;--board-d:#6E5234}
body.bd-cork .canvas{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.55' numOctaves='3' seed='2'/><feColorMatrix values='0 0 0 0 .3 0 0 0 0 .18 0 0 0 0 .05 0 0 0 .55 -.15'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");background-size:140px 140px}
body.bd-cork .board-scroll{--ink:#2B1C0C;--ink2:#3E2A14;--ink3:#5A4128}
body.bd-wall{--board:#EFEAE2;--board-d:#23211D}
body.bd-wall .canvas{background-image:linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:calc(48px*var(--z)) 100%}
body.bd-glow{--board:#E7E4F3;--board-d:#191823}
body.bd-glow .board-scroll{background:radial-gradient(circle at 15% 22%,var(--g1),transparent 280px),radial-gradient(circle at 80% 70%,var(--g2),transparent 340px),radial-gradient(circle at 58% 8%,var(--g3),transparent 240px),var(--board)}
body.bd-glow .canvas{background-image:none}
body.bd-margin{--board:#FBFAF7;--board-d:#1F1E1C}
body.bd-margin .canvas{background-image:linear-gradient(90deg,transparent calc(40px*var(--z)),rgba(220,80,80,.3) calc(40px*var(--z)),rgba(220,80,80,.3) calc(41px*var(--z)),transparent calc(41px*var(--z))),repeating-linear-gradient(transparent 0,transparent calc(27px*var(--z)),rgba(90,120,160,.14) calc(27px*var(--z)),rgba(90,120,160,.14) calc(28px*var(--z)));background-size:auto}
body.bd-desk{--board:#E3E8EE;--board-d:#1B2128}
body.bd-navy{--board:#1F2A44;--board-d:#141B2E}
body.bd-navy .board-scroll{--ink:#E8ECF5;--ink2:#B6C0D6;--ink3:#8591AB;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.18);--pop:#2A3656;--dots:rgba(255,255,255,.07);--sel:rgba(255,255,255,.08);--win:#18223A}
body.bd-sage{--board:#CCD4C4;--board-d:#262B24}
body.bd-steel{--board:#CFCFCB;--board-d:#262626}


body.bd-mist{--board:#EEF1F6;--board-d:#1B1D23}
body.bd-mist .board-scroll{background:linear-gradient(135deg,color-mix(in srgb,var(--board) 100%,#DDE6F5) 0%,color-mix(in srgb,var(--board) 88%,#F2DDEA) 55%,color-mix(in srgb,var(--board) 90%,#FFF1D6) 100%)}
body.bd-cream{--board:#F1ECE2;--board-d:#22201C}

/* pads follow sticky style */
body:not(.sty-classic) .pad::after{display:none}
body:not(.sty-classic) .pad{background-image:none}
body.sty-tape .pad,body.sty-minimal .pad,body.sty-grid .pad,body.sty-pola .pad,body.sty-receipt .pad,body.sty-index .pad{--s2:#F3F0E8;--s3:#E7E3DA;--edge:rgba(0,0,0,.13)}
body.sty-tape .pad{background:#FFFDF7;border-radius:2px}
body.sty-tape .pad::before{content:"";position:absolute;top:-5px;left:10px;width:24px;height:9px;background:color-mix(in srgb,var(--sd) 60%,transparent);transform:rotate(-5deg);mix-blend-mode:multiply}
body.sty-glass .pad{background:color-mix(in srgb,var(--s) 38%,rgba(255,255,255,.55));border:1px solid rgba(255,255,255,.85);border-radius:10px;filter:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),4px 4px 0 -1px color-mix(in srgb,var(--s) 25%,rgba(255,255,255,.6)),0 8px 14px -8px rgba(40,30,90,.35)}
body.sty-minimal .pad{--s2:var(--mn-bg);--s3:var(--mn-bg);--edge:var(--mn-line);background:var(--mn-bg);border:1px solid var(--mn-line);border-radius:9px;filter:none;box-shadow:3px 3px 0 -1px var(--mn-bg),3px 3px 0 0 var(--mn-line),6px 6px 0 -1px var(--mn-bg),6px 6px 0 0 var(--mn-line)}
body.sty-minimal .pad::before{content:"";position:absolute;left:7px;top:7px;width:7px;height:7px;border-radius:50%;background:var(--sd)}
body.sty-grid .pad{background-color:#FFFFFB;background-image:linear-gradient(#DCE7F0 1px,transparent 1px),linear-gradient(90deg,#DCE7F0 1px,transparent 1px);background-size:6px 6px;border-radius:2px}
body.sty-grid .pad::before{content:"";position:absolute;left:6px;right:6px;top:15px;height:8px;background:color-mix(in srgb,var(--sd) 45%,transparent)}

body.sty-index .pad{background:#FFFEFA repeating-linear-gradient(transparent 0 7px,#BFD4EE 7px 8px);border-top:4px solid var(--sd);box-sizing:border-box;border-radius:1px}

.inboxbtn.drop-hot{background:var(--accent);color:#fff}

.row{height:auto!important;min-height:54px}
.row.collapse{height:0!important;min-height:0!important}
.row-in{position:relative;inset:auto;align-items:flex-start;padding:11px 12px 11px;min-height:54px;box-sizing:border-box}
.row .chk{margin-top:1px}
.row .rt b{font-size:14.5px;font-weight:500;line-height:21px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

.rwhere{flex:0 1 auto;max-width:42%;min-width:0;display:inline-flex;align-items:center;gap:6px;margin-top:1px;padding:2px 10px 2px 8px;border-radius:99px;background:color-mix(in srgb,var(--s) 80%,#fff);color:var(--si);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--sd) 35%,transparent);filter:var(--stk-filter);font-size:12px;font-weight:600;line-height:18px;white-space:nowrap;overflow:hidden}
.rwhere .dot{width:7px;height:7px;border-radius:50%;flex:none;box-shadow:none}
.rwhere .rwa{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.rwhere .rwp{display:inline-flex;align-items:center;gap:3px;font-weight:500;min-width:0;flex:0 1 auto}

.rwhere .rwp svg.i{width:11px;height:11px;flex:none}
.rwhere .rwa+.rwp{border-left:1px solid color-mix(in srgb,var(--sd) 45%,transparent);padding-left:6px}
.lv .lgroup.flat{margin-top:6px}
.ladd .pl{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--accent);flex:none;transition:background .15s,color .15s}

.ladd:hover .pl,.ladd.on .pl{background:var(--accent);color:#fff}
.ladd:hover .pl svg.i,.ladd.on .pl svg.i{width:13px;height:13px;stroke-width:2.4}
.ladd{opacity:1;color:var(--ink3)}
button.ladd:hover{background:none;color:var(--accent)}
.ladd.gadd{height:34px;opacity:0;transition:opacity .15s}
.lgroup:hover .ladd.gadd,.ladd.gadd:focus-visible{opacity:1}
.ladd.lall{height:44px;margin-top:2px}
.lv .lgroup{margin-bottom:10px}
.lempty{padding:40px 12px 18px;color:var(--ink3);font-size:13px;line-height:1.7}

.kbt{display:inline-flex;align-items:center;gap:6px;align-self:flex-start}.kbt svg.i{width:14px;height:14px}
.kbl{display:flex;flex-direction:column;gap:12px;margin-top:8px;padding:12px;border-radius:10px;background:var(--sel)}
.kbg{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--ink2)}

.kbg>div>span{min-width:104px;display:inline-flex;gap:3px;color:var(--ink3);font-size:11.5px}

@media (hover:none){.ladd.gadd{display:none}}
@media (max-width:760px){

/* ---------- composer ---------- */
.cmp>*{flex-shrink:0}
.cmp{position:fixed;inset:0;z-index:940;overflow-y:auto;background:linear-gradient(180deg,color-mix(in srgb,var(--board) 45%,var(--win)) 0%,var(--board) 100%);animation:cmpIn .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;align-items:center;padding:34px 40px 26px;box-sizing:border-box;transition:opacity .25s}
@keyframes cmpIn{from{opacity:0;transform:scale(.985)}}
.cmp.out{opacity:0;pointer-events:none}
.cmp-x{position:fixed;right:22px;top:calc(18px + env(safe-area-inset-top,0px));width:36px;height:36px;border-radius:50%;background:color-mix(in srgb,var(--pop) 80%,transparent);display:flex;align-items:center;justify-content:center;color:var(--ink2);z-index:2;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.cmp-h{text-align:center;margin-bottom:38px}
.cmp-h h2{font-family:var(--f-min);font-size:24px;margin:0;font-weight:700;letter-spacing:.02em}
.cmp-h p{font-size:12.5px;color:var(--ink3);margin:6px 0 0}
.cmp-stage{display:grid;grid-template-columns:1fr auto 1fr;gap:22px;width:100%;max-width:1000px;align-items:start}
.cmp-note{grid-column:2;position:relative;width:340px;min-height:256px;padding:26px 26px 16px;box-sizing:border-box;border-radius:3px 3px 4px 26px/3px 3px 4px 15px;background-color:var(--s);color:var(--si);background-image:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,0) 40px),linear-gradient(135deg,rgba(255,255,255,.45),rgba(255,255,255,0) 45%);box-shadow:0 2px 3px rgba(0,0,0,.12),0 36px 50px -26px rgba(80,40,0,.5);transform:rotate(-1.4deg);display:flex;flex-direction:column;font-family:var(--f-note);transition:background-color .3s,color .3s,transform .3s,box-shadow .2s;touch-action:none;cursor:grab;user-select:none}
.cmp-note::after{content:"";position:absolute;right:0;bottom:0;width:40px;height:40px;background:linear-gradient(315deg,transparent 45%,rgba(0,0,0,.08) 50%,rgba(255,255,255,.5) 57%,transparent 72%);pointer-events:none}
.cmp-note.dragging{transition:none;cursor:grabbing;box-shadow:0 2px 3px rgba(0,0,0,.12),0 46px 60px -24px rgba(80,40,0,.55);z-index:5}
.cmp-tabs{position:absolute;top:-21px;left:16px;display:flex;gap:5px}
.cmp-tab{min-width:46px;max-width:76px;height:24px;padding:4px 9px 0;box-sizing:border-box;border-radius:6px 6px 0 0;background:var(--s);color:var(--si);font-family:var(--f-ui);font-size:10px;font-weight:700;opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;box-shadow:inset 0 -6px 6px -4px rgba(0,0,0,.14);transition:height .15s,margin .15s,opacity .15s;filter:var(--stk-filter);align-self:flex-end}
.cmp-tab:hover{height:28px;opacity:1}
.cmp-tab.on{height:32px;opacity:1;color:var(--si)}
.cmp-nl{display:flex;justify-content:space-between;font-family:var(--f-ui);font-size:11px;font-weight:700;opacity:.62;letter-spacing:.06em;min-height:15px}
.cmp-title,.cmp-memo{border:0;background:none;outline:none;resize:none;color:inherit;padding:0;width:100%;overflow:hidden;cursor:text;user-select:text}
.cmp-title{font-family:inherit;font-size:23px;font-weight:800;line-height:1.45;margin-top:8px;min-height:34px}
.cmp-memo{font-family:var(--f-ui);font-size:13px;line-height:1.6;opacity:.7;margin-top:6px}
.cmp-title::placeholder,.cmp-memo::placeholder{color:currentColor;opacity:.36}
.cmp-seals{margin-top:auto;padding-top:10px;display:flex;gap:5px;flex-wrap:wrap;padding-right:30px}
.cmp-seals span{font-family:var(--f-ui);font-size:11px;font-weight:700;background:rgba(0,0,0,.08);padding:3px 9px;border-radius:99px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmp-subs{grid-column:3;display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding-top:30px}
.cmp-subs button{font-size:12px;padding:4px 11px;border-radius:99px;background:color-mix(in srgb,var(--pop) 80%,transparent);color:var(--ink2);border:1px solid var(--line)}
.cmp-subs button.on{background:var(--ink);color:var(--win);border-color:var(--ink)}
.cmp-mid{min-height:72px;margin-top:28px;display:flex;justify-content:center;width:100%;max-width:1000px}
.cmp-det{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
.dc{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:12px;background:color-mix(in srgb,var(--pop) 80%,transparent);border:1px solid var(--line2);font-size:12.5px;color:var(--ink2);white-space:nowrap;max-width:220px;box-shadow:0 4px 10px -8px rgba(0,0,0,.3);transition:all .12s}
.dc span{overflow:hidden;text-overflow:ellipsis}
.dc svg.i{width:15px;height:15px;color:var(--ink3)}
.dc:hover,.dc.open{color:var(--ink);border-color:var(--ink3)}
.dc.set{background:var(--pop);color:var(--ink);font-weight:600}
.dc.set svg.i{color:var(--accent)}
.cmp-q{width:min(600px,100%);background:var(--pop);border-radius:22px;padding:18px 20px 16px;box-shadow:0 26px 50px -26px rgba(60,40,10,.5);border:1px solid color-mix(in srgb,#B4561A 18%,transparent);position:relative;animation:rise .25s cubic-bezier(.2,.9,.3,1.1)}
.cmp-q::after{content:"";position:absolute;left:50%;bottom:-9px;width:16px;height:16px;margin-left:-8px;background:var(--pop);transform:rotate(45deg);border-right:1px solid color-mix(in srgb,#B4561A 18%,transparent);border-bottom:1px solid color-mix(in srgb,#B4561A 18%,transparent)}
.cmp-q .kick{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;font-weight:700;letter-spacing:.2em;color:#B4561A}
.cmp-qx{font-size:11.5px;letter-spacing:0;color:var(--accent);font-weight:600}
.cmp-q .qt{font-family:var(--f-min);font-size:21px;font-weight:700;margin:4px 0 12px}
.qopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.qopt{display:flex;gap:10px;align-items:center;padding:11px 13px;border-radius:14px;background:var(--sel);border:1.5px solid transparent;text-align:left;transition:all .12s}
.qopt:hover{background:var(--pop);border-color:var(--accent);box-shadow:0 8px 18px -12px color-mix(in srgb,var(--accent) 70%,transparent)}
.qopt b{display:block;font-size:13.5px}.qopt small{display:block;font-size:11px;color:var(--ink3);margin-top:1px}
.qsteps{display:flex;gap:5px;margin-top:12px}.qsteps i{flex:1;height:3px;border-radius:3px;background:var(--sel)}.qsteps i.on{background:#B4561A}
.tsq{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--gc,var(--c));color:#fff;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.tsq svg.i{width:15px;height:15px;stroke-width:2.1;color:#fff}
.cmp-th{width:100%;max-width:1000px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink3);margin:18px 0 12px;padding:0 8px;box-sizing:border-box;min-height:32px}
.cmp-qb{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:99px;background:var(--pop);color:#B4561A;font-weight:700;font-size:12.5px;box-shadow:0 4px 12px -6px rgba(180,86,26,.5);border:1px solid rgba(180,86,26,.25)}
.cmp-qb:hover{background:#B4561A;color:#fff}
.cmp-trays{width:100%;max-width:1000px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.ctray{position:relative;height:178px;text-align:left;transition:transform .22s cubic-bezier(.2,.9,.3,1.3),opacity .2s,filter .2s}
.ctray .tback{position:absolute;left:8px;right:8px;top:0;height:104px;border-radius:14px 14px 0 0;background:linear-gradient(180deg,color-mix(in srgb,var(--pop) 75%,transparent),color-mix(in srgb,var(--pop) 25%,transparent));box-shadow:inset 0 2px 0 color-mix(in srgb,var(--pop) 90%,transparent)}
.ctray .tfront{position:absolute;left:0;right:0;top:50px;bottom:0;border-radius:16px;background:var(--pop);box-shadow:0 18px 26px -18px rgba(60,40,10,.55),inset 0 -3px 0 rgba(0,0,0,.05);padding:14px 14px 12px;display:flex;flex-direction:column;gap:4px;border-top:5px solid var(--c);box-sizing:border-box;transition:box-shadow .2s}
.ctray .tfront b{font-size:14.5px;padding-right:32px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctray .ts{font-size:11px;color:var(--ink3);line-height:1.5;padding-right:4px}
.ctray .tc{margin-top:auto;font-size:10.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.ctray .tsq{position:absolute;right:12px;top:12px}
.ctray.two .tfront{background:#3BAE77;color:#fff;border-top-color:#2F8A5F}.ctray.two .ts{color:rgba(255,255,255,.88)}
.ctray.two .tsq{background:rgba(255,255,255,.25)}
.ctray:hover,.ctray.on{transform:translateY(-10px)}
.ctray:hover .tfront,.ctray.on .tfront,.ctray.open .tfront{box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 45%,transparent),0 26px 34px -18px rgba(60,40,10,.6)}
.ctray.dim{opacity:.32;filter:saturate(.4)}
.ctray.hint .tfront{box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 40%,transparent),0 18px 26px -18px rgba(60,40,10,.55)}
.cmp-foot{margin-top:22px;font-size:12px;color:var(--ink3)}
.cmp-foot button{color:var(--accent);font-weight:600}
.cmp-pop{min-width:200px;z-index:980}
.cmp-pop .cp-row{display:flex;gap:6px;flex-wrap:wrap;padding:2px 8px 8px}
.cmp-pop .chip input[type=time]{border:0;background:none;outline:none;font-size:12px;color:inherit;width:78px}
.cmp-pop .cp-go{display:flex;justify-content:flex-end;padding:6px 8px 4px}
.cmp-pop .cp-who{margin:4px 8px 4px;width:calc(100% - 16px);box-sizing:border-box}
.hanko{position:absolute;right:26px;bottom:26px;width:96px;height:96px;box-sizing:border-box;border-radius:50%;border:3px solid var(--sc);color:var(--sc);display:flex;flex-direction:column;align-items:center;justify-content:center;font-style:normal;font-family:var(--f-ui);font-weight:800;font-size:15px;letter-spacing:.06em;line-height:1.2;box-shadow:inset 0 0 0 5px transparent,inset 0 0 0 6.5px color-mix(in srgb,var(--sc) 45%,transparent);opacity:.88;transform:rotate(-14deg);pointer-events:none;mix-blend-mode:multiply;z-index:3}
.hanko small{font-size:8.5px;letter-spacing:.22em;font-weight:700;opacity:.85}
.hanko em{font-style:normal;font-size:10px;font-weight:700;letter-spacing:0;margin-top:2px;max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmp-hanko{animation:hankoIn .38s cubic-bezier(.3,1.6,.5,1) both}
@keyframes hankoIn{0%{transform:scale(2.2) rotate(-34deg);opacity:0}60%{opacity:.95}100%{transform:scale(1) rotate(-14deg);opacity:.88}}
.cmp-note.stamped{animation:thud .38s ease-out}
@keyframes thud{40%{transform:rotate(-1.4deg) scale(.975)}}
.cmp-fly{pointer-events:none}
.stk .stk-hanko{right:12px;bottom:34px;width:60px;height:60px;border-width:2px;font-size:10px;animation:hankoFade 3.4s ease-in forwards}
.stk .stk-hanko small{font-size:6.5px}.stk .stk-hanko em{font-size:8px;max-width:50px}
@keyframes hankoFade{0%,70%{opacity:.88}100%{opacity:0}}
.cmp-land{animation:land .9s ease-out}
@keyframes land{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent);transform:scale(1.04)}100%{box-shadow:0 0 0 14px transparent;transform:none}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hanko{mix-blend-mode:normal}}
:root[data-theme="dark"] .hanko{mix-blend-mode:normal}
@media (max-width:760px){
  .cmp{padding:calc(22px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px))}
  .cmp-h{margin-bottom:30px}.cmp-h h2{font-size:19px}.cmp-h p{display:none}
  .cmp-stage{grid-template-columns:1fr;gap:10px;justify-items:center}
  .cmp-note{grid-column:1;width:min(310px,84vw);min-height:200px;padding:22px 20px 14px}
  .cmp-title{font-size:20px}
  .cmp-subs{grid-column:1;flex-direction:row;flex-wrap:wrap;justify-content:center;padding-top:2px}
  .cmp-mid{margin-top:16px;min-height:0}
  .cmp-det{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;width:100%;padding:2px 2px 6px;scrollbar-width:none}
  .cmp-det::-webkit-scrollbar{display:none}
  .cmp-th{margin:14px 0 8px}
  .cmp-trays{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
  .ctray{height:92px}.ctray .tback{display:none}.ctray .tfront{top:0;padding:11px 10px 9px}.ctray .ts,.ctray .tc{display:none}
  .ctray .tfront b{font-size:12.5px;padding-right:0;margin-top:auto}.ctray .tsq{position:static;width:26px;height:26px}
  .ctray:hover,.ctray.on{transform:translateY(-4px)}
  .hanko{width:80px;height:80px;font-size:13px;right:18px;bottom:18px}
}

.ed-t::placeholder,.ed-n::placeholder{color:var(--ink3);font-weight:inherit}
.eg{background:var(--pop);border-radius:12px;box-shadow:0 0 0 1px var(--line);margin-bottom:10px;overflow:hidden}
.er{display:flex;align-items:center;gap:12px;width:100%;min-height:42px;padding:0 12px 0 14px;font-size:14px;text-align:left;position:relative;color:var(--ink);box-sizing:border-box;transition:background .12s}

.eri{width:22px;display:flex;justify-content:center;color:var(--ink3);flex:none}

.erl{flex:1;min-width:0;white-space:nowrap}

function parse(raw){

  s=s.replace(/(\d+(?:\.\d+)?)\s*(時間|h)(?![a-z])/i,(m,n)=>{mins=Math.round(+n*60);return ''});
  s=s.replace(/(\d+)\s*(min|分|m)(?![a-z])/i,(m,n)=>{mins=+n;return ''});
  s=s.replace(/@(\S+)/,(m,n)=>{const a=S.areas.find(x=>x.name===n);if(a){ar=a.id;return ''}return m});

}

  const G=LG.find(g=>g.id===gid);if(!G)return;const curG=LG.find(g=>g.items.includes(t)),k=listKey(),moved=G!==curG;
  const was={status:t.status,area:t.area,due:t.due,start:t.start,cdate:t.cdate,ctime:t.ctime,project:t.project,minutes:t.minutes,sched:t.sched};
  const lo0=t.lo?{...t.lo}:null;

  if(lsortOf()==='manual'){const arr=sortItems(G.items).filter(x=>x!==t);arr.splice(idx,0,t);arr.forEach((x,i)=>{(x.lo=x.lo||{})[k]=i+1})}

function renderLog(el){

  h+=`<div class="past" style="height:${nowMin()/60*hp+8}px"></div><div class="tl-blocks" id="tlBlocks"></div><div class="now" id="nowLine" style="top:${nowMin()/60*hp+8}px"><span>${clock(nowMin())}</span></div>`;
  day.innerHTML=h;
  const lay=layoutBlocks(items.slice());
  $('#tlBlocks').innerHTML=items.map(u=>{const x=u.t,L=lay.get(x.id),m=uMin(u),ht=Math.max(16,m/60*hp-4),on=uActive(u);
    const st0=entStart(u);return `<div class="blk ${colorOf(u.t)} ${ht<32?'short':''} ${on?'':'done-blk'} ${u.cal?'calb':''}" data-id="${x.id}" style="top:${st0/60*hp+8+1.5}px;height:${ht}px;left:calc(${L.col/L.n*100}% + ${L.col?2:0}px);width:calc(${100/L.n}% - ${L.col?2:0}px)">
      ${on?`<button class="chk" aria-label="完了">${ic('log')}</button>`:''}<div class="bt"><b>${u.cal?ic('lock'):''}${esc(x.title)}</b><time>${isChild(u.t)?esc(projOf(u.t).title)+' · ':''}${clock(st0)}–${clock(st0+m)}</time></div>${on?'<div class="rsz"></div>':''}</div>`}).join('');
  $$('.blk',el).forEach(b=>{const u=items.find(u=>u.t.id===b.dataset.id);if(u&&uActive(u))bindItem(b,u,'timeline')});
  const sc=$('#tlScroll');

let tlJustOpened=true;
function layoutBlocks(list){
  list.sort((a,b)=>entStart(a)-entStart(b));const out=new Map();let cluster=[],colEnds=[],end=-1;
  const flush=()=>{const n=Math.max(1,...cluster.map(c=>c.col+1));cluster.forEach(c=>out.set(c.id,{col:c.col,n}));cluster=[];colEnds=[];end=-1};
  for(const u of list){const x=u.t,s=entStart(u),e=s+uMin(u);if(cluster.length&&s>=end)flush();
    let col=colEnds.findIndex(v=>v<=s);if(col<0){col=colEnds.length;colEnds.push(e)}else colEnds[col]=e;cluster.push({id:x.id,col});end=Math.max(end,e)}
  if(cluster.length)flush();return out;
}
function toggleTL(){S.ui.tl=!S.ui.tl;save();if(S.ui.tl)tlJustOpened=true;fitForTL(S.ui.tl);applyTL();$('#tlBtn')?.classList.toggle('on',S.ui.tl)}
let zoomBeforeTL=null;
function fitForTL(opening){
  const sc=$('#boardScroll');if(!sc||S.ui.view!=='board'||innerWidth<=760)return;
  if(!opening){if(zoomBeforeTL){setZoom(zoomBeforeTL);zoomBeforeTL=null}return}
  const r=sc.getBoundingClientRect(),newRight=r.right-268;
  const vis=$$('.plane .stk:not(.gone)').map(e=>e.getBoundingClientRect()).filter(b=>b.right>r.left&&b.left<r.right&&b.bottom>r.top&&b.top<r.bottom);
  if(!vis.length)return;
  const right=Math.max(...vis.map(b=>b.right))+16;
  if(right<=newRight)return;
  const f=(newRight-r.left)/(right-r.left);
  const want=S.ui.zoom*f;const pick=[...SIZES].reverse().find(x=>x.z<=want+.001)||SIZES[0];
  if(pick.z<S.ui.zoom){zoomBeforeTL=S.ui.zoom;setZoom(pick.z)}
}

/* ---------- drag engine ---------- */
let D=null;
function bindItem(el,u,from){
  el.addEventListener('pointerdown',e=>{
    if(e.button!==0)return;
    if(e.target.closest('.chk')){e.stopPropagation();return}
    if(e.target.closest('.ra,.sw-bg'))return;
    if(e.target.closest('.rsz')){startResize(e,el,u);return}
    if(from==='list'&&e.pointerType!=='mouse'){swipeDown(e,el,u);return}
    if(e.pointerType==='mouse'&&!e.target.closest('input,textarea,select,[contenteditable]'))e.preventDefault();
    const r=el.getBoundingClientRect();
    D={u,t:u.t,el,from,sx:e.clientX,sy:e.clientY,cx:e.clientX,cy:e.clientY,active:false,ox:e.clientX-r.left,oy:e.clientY-r.top,zone:null};
    window.addEventListener('pointermove',pmove);window.addEventListener('pointerup',pup);window.addEventListener('pointercancel',pup);
  });
  const c=$('.chk',el);if(c)c.onclick=e=>{e.stopPropagation();complete(u,el,from)};
}
function activate(){
  D.active=true;try{window.getSelection().removeAllRanges()}catch(_){}const t=D.t,g=document.createElement('div');
  g.className='stk ghost '+colorOf(t);g.style.setProperty('--r','0deg');g.innerHTML=stickyInner(t);
  const gz=D.from==='board'?S.ui.zoom:1;g.style.setProperty('--gz',gz);
  g.style.width='176px';g.style.minHeight='0';g.style.height=stkH(t)+'px';
  if(D.from==='board'){D.gox=D.ox;D.goy=D.oy}else{D.gox=36;D.goy=22}
  if(D.from==='list'){const r=D.el.getBoundingClientRect();g.classList.add('lg');D.gw=r.width;D.gh=r.height;g.style.width=r.width+'px';g.style.height=r.height+'px';D.gox=D.ox;D.goy=D.oy}
  if(D.from==='timeline'){const r=D.el.getBoundingClientRect();g.classList.add('as-block','in-tl');g.style.width=r.width+'px';g.style.height=r.height+'px';g.style.left=r.left+'px';g.style.top=r.top+'px'}
  document.body.appendChild(g);D.g=g;D.el.classList.add('src-hidden');document.body.classList.add('is-dragging');
  autoLoop();
}
function pmove(e){
  if(!D)return;D.cx=e.clientX;D.cy=e.clientY;
  if(!D.active){if(Math.hypot(e.clientX-D.sx,e.clientY-D.sy)<5)return;activate()}
  position();
}
function zoneAt(x,y){
  const el=document.elementFromPoint(x,y);if(!el)return null;
  const nav=el.closest('[data-drop]');if(nav)return{type:'nav',el:nav,val:nav.dataset.drop};
  if(el.closest('#tlScroll'))return{type:'tl'};

function position(){

    const m=uMin(D.u);

    $('.g-time',g).textContent=clock(start)+'–'+clock(start+m);
  }else{
    if(g.classList.contains('as-block')){g.classList.remove('as-block');g.style.width=(D.gw||176)+'px';g.style.height=(D.gh||stkH(t))+'px';setTimeout(()=>g&&g.classList.remove('in-tl'),200)}
    g.classList.toggle('to-done',z?.type==='nav'&&z.val==='done');
    if(zoneMode()&&S.ui.view==='board'){const pl=$('.plane');let hz=null;if(z?.type==='board'&&pl){const r=pl.getBoundingClientRect();hz=zoneAtY((D.cy-D.goy*(D.from==='board'?S.ui.zoom:1)-r.top)/S.ui.zoom+30)}$$('.zone').forEach(n=>n.classList.toggle('hot',n.dataset.zone===hz&&(zoneOf(D.t)!==hz||D.from!=='board')))}
    if(z?.type==='nav')z.el.classList.add('drop-hot');
    if(z?.type==='list'&&D.from==='list')listHover();else{hideLins();D.lt=null}
    g.style.left=(D.cx-D.gox)+'px';g.style.top=(D.cy-D.goy)+'px';
    g.style.setProperty('--gz',D.from==='board'?S.ui.zoom:1);

function autoLoop(){

    if(D.cy<r.top+44)v=-(r.top+44-D.cy)/3;else if(D.cy>r.bottom-44)v=(D.cy-r.bottom+44)/3;

    if(D.cy<r.top+50)v=-(r.top+50-D.cy)/3;else if(D.cy>r.bottom-50)v=(D.cy-r.bottom+50)/3;

function startDraft(p,x,y,fromRect,opts={}){

function positionTray(){

function rvAct(t,k,btn){

}

function arrangeBoard(kind){

/* 1件ずつ「最後に同期した内容（SB.h）」と比べて、どちらで変わったかを判断する */
function reconcile(id,rj,cur,setLocal,delLocal,allowDel){
  const r=hj(rj),b=SB.h[id],l=cur==null?null:hj(cur);

  if(rj==null){if(b===undefined||!allowDel)return false;let ch=false;if(l===b){delLocal();ch=true}delete SB.h[id];return ch}
  let ch=false;if(l!==r){setLocal(rj);ch=true}SB.h[id]=r;return ch;

    const loc=new Map(S.tasks.map(t=>[t.id,t]));
    const ids=new Set([...rem.keys(),...Object.keys(SB.h).filter(k=>k!=='__meta'),...loc.keys()]);
    let ch=false;
    ids.forEach(id=>{const t=loc.get(id);
      ch=reconcile(id,rem.has(id)?rem.get(id):null,t?JSON.stringify(t):null,
        rj=>{const o=fixTask(JSON.parse(rj));if(t){Object.keys(t).forEach(k=>delete t[k]);Object.assign(t,o)}else S.tasks.push(o)},
        ()=>{const i=S.tasks.indexOf(t);if(i>=0)S.tasks.splice(i,1)},srv)||ch});

  },syncErr));

  const bar=$('#bar');bar.className='bar pbar'+(sec==='review'?' compact always':'');
  bar.innerHTML=`<div class="pb">${back?`<button class="pb-back" id="pbBack">${ic('chev')}${PJ&&S.ui.fromProjects?'プロジェクト':'その他'}</button>`:''}<b class="pb-t">${esc(phTitle())}</b><span class="spacer"></span>
   ${F.area&&!PJ?`<button class="pb-ib" id="editArea" aria-label="エリアを編集">${ic('edit')}</button>`:''}${PJ?`<button class="pb-ib" id="pEdit" aria-label="プロジェクトを編集">${ic('edit')}</button>`:''}
   ${sec==='projects'?`<button class="pb-ib" id="newProj" aria-label="新しいプロジェクト">${ic('plus')}</button>`:''}
   ${sec!=='more'&&sec!=='review'?`<button class="pb-ib" id="searchBtn" aria-label="検索">${ic('search')}</button>`:''}
   ${listy?`<button class="pb-ib ${lsortOf()!==natSort()?'on':''}" id="arrBtn" aria-label="並び順">${ic('sort')}</button><button class="pb-ib ${filterOn()?'on':''}" id="fAll" aria-label="絞り込み">${ic('filter')}</button>`:''}</div>`;
  const bk=$('#pbBack');if(bk)bk.onclick=()=>{const toP=PJ&&S.ui.fromProjects;F.area=null;S.ui.section=toP?'projects':'more';S.ui.fromProjects=false;save();render()};
  const sb=$('#searchBtn');if(sb)sb.onclick=openSearch;
  const ab=$('#arrBtn');if(ab)ab.onclick=e=>{e.stopPropagation();openArrangePop(ab)};
  const fa=$('#fAll');if(fa)fa.onclick=e=>{e.stopPropagation();openFilterSheet()};
  const ea=$('#editArea');if(ea)ea.onclick=()=>openAreaEditor(area(F.area));
  const pe=$('#pEdit');if(pe)pe.onclick=()=>openEditor(PJ);
  const np=$('#newProj');if(np)np.onclick=()=>openEditor(null,null,null,{kind:'project'});
}
/* スクロールで見出しを上のバーへ */
function bindPhScroll(){
  if(!narrow())return;const bar=$('#bar');const sc=$('#view .list-scroll');
  if(!sc){bar.classList.add('compact');return}
  const f=()=>{if(!bar.classList.contains('always'))bar.classList.toggle('compact',sc.scrollTop>38)};
  sc.addEventListener('scroll',f,{passive:true});f();
  const h=$('.ph-head',sc);if(h)bindPhHead(h);
}
/* 絞り込みシート */
function openFilterSheet(){
  const scrim=document.createElement('div');scrim.className='scrim phsheet';
  const ch=(on,k,v,h)=>`<button class="ph-cp ${on?'on':''}" data-k="${k}" data-v="${v}">${h}</button>`;
  const brk='<i class="ph-br"></i>';
  const draw=()=>{applyFilter();renderBarCount();const n=$('#listEl')?$$('#listEl .row[data-id]').filter(r=>!r.hidden).length:0;
    scrim.innerHTML=`<div class="sheet ph-sh" role="dialog" aria-label="絞り込み"><div class="grab"></div>
    <div class="ph-shh"><button id="fsClr" ${filterOn()?'':'disabled'}>すべて解除</button><b>絞り込み</b><button class="b" id="fsDone">完了</button></div>
    <div class="ph-shb">
     <div class="ph-sec">締切・予定日<small>Calendar の予定日も含みます</small></div><div class="ph-ig"><div class="ph-chips">${DUEF.map(x=>ch(F.due===x.id,'due',x.id,x.l.replace('（遅れを含む）',''))).join('')}</div></div>
     <div class="ph-sec">所要時間</div><div class="ph-ig"><div class="ph-chips">${TIMEF.map(x=>ch(F.time===x.id,'time',x.id,x.l)).join('')}</div></div>
     <div class="ph-sec">場所・時間帯・道具</div><div class="ph-ig"><div class="ph-chips">${sepMap(TAGS,g=>ch(F.tags.has(g.id),'tag',g.id,ic(g.icon||'pin')+esc(g.name)),brk)||'<span class="ph-none">まだありません</span>'}</div></div>
     <div class="ph-sec">集中度</div><div class="ph-ig"><div class="ph-chips">${ENERGY.map(x=>ch(F.energy===x.id,'energy',x.id,`<span class="en-dot en-${x.id}"></span>${x.l}`)).join('')}</div></div>
     <div class="ph-sec">タグ</div><div class="ph-ig"><div class="ph-chips">${S.labels.some(x=>!x.sep)?sepMap(S.labels,g=>ch(F.labels.has(g.id),'label',g.id,'#'+esc(g.name)),brk):'<span class="ph-none">タグはまだありません。タスクの編集画面で追加できます。</span>'}</div></div>
    </div><button class="ph-big" id="fsGo">${n}件を表示</button></div>`;
    $$('.ph-cp',scrim).forEach(b=>b.onclick=()=>{const k=b.dataset.k,v=b.dataset.v;
      if(k==='tag')F.tags.has(v)?F.tags.delete(v):F.tags.add(v);else if(k==='label')F.labels.has(v)?F.labels.delete(v):F.labels.add(v);
      else{const key=k==='due'?'due':k==='time'?'time':'energy';F[key]=F[key]===v?null:v}
      const sb=$('.ph-shb',scrim).scrollTop;draw();$('.ph-shb',scrim).scrollTop=sb});
    $('#fsClr',scrim).onclick=()=>{F.tags.clear();F.labels.clear();F.due=F.time=F.energy=null;draw()};
    $('#fsDone',scrim).onclick=close;$('#fsGo',scrim).onclick=close};
  const close=()=>{scrim.remove();renderBar();renderMain()};
  scrim.addEventListener('pointerdown',e=>{if(e.target===scrim)close()});
  draw();document.body.appendChild(scrim);
}
/* 「その他」画面 */
function renderMore(el){
  const cnt=s=>s==='tickler'?S.tasks.filter(tickled).length:S.tasks.filter(t=>t.status===s&&!isProj(t)&&!tickled(t)&&!queued(t)).length;
  const rvAgo=S.ui.lastReview?-dayDiff(dayKey(new Date(S.ui.lastReview))):null;
  const doneToday=logItems().filter(x=>dayKey(new Date(x.doneAt))===todayKey()).length;
  const it=(attr,ico,cls,l,v,vc='')=>`<button class="ph-ir ic" ${attr}><span class="ph-ico ${cls}">${ic(ico)}</span><span class="l">${l}</span>${v!==''&&v!=null?`<span class="v ${vc}">${v}</span>`:''}<span class="cv">${ic('chev')}</span></button>`;
  const fs=foldables(),anyOpen=fs.some(t=>!(S.ui.fold||{})[t.id]);
  const areas=orderedAreas().filter(a=>{const R=rootOf(a);return R===a||!(S.ui.fold||{})[R.id]}).map(a=>{const sub=rootOf(a)!==a;const n=S.tasks.filter(t=>inArea(t,a.id)&&active(t)&&t.status!=='inbox'&&!isProj(t)).length;const kc=sub?0:kids(a.id).length;
    return `<button class="ph-ir ic ${sub?'sub':''}" data-marea="${a.id}"><span class="ph-dt c-${areaColor(a)}"><i class="dot"></i></span><span class="l">${esc(a.name)}</span>${kc?`<span class="ph-kids" data-mtog="${a.id}">${ic('chev')}${kc}</span>`:''}<span class="v">${n||''}</span><span class="cv">${ic('chev')}</span></button>`}).join('');
  el.innerHTML=`<div class="list-scroll"><div class="list ph-more">${phHead()}
   <div class="ph-ig">${it('data-msec="waiting"','waiting','g-waiting','Waiting',cnt('waiting'))}${it('data-msec="someday"','someday','g-someday','Someday',cnt('someday'))}${it('data-msec="tickler"','tickler','g-tickler','Tickler',cnt('tickler'))}${it('data-msec="projects"','clip','g-projects','プロジェクト',projects().length)}</div>
   <div class="ph-sec row">エリア<span>${fs.length?`<button id="mFold">${anyOpen?'すべてたたむ':'すべて開く'}</button>`:''}<button id="mAddArea">追加</button></span></div>
   <div class="ph-ig">${areas||'<div class="ph-none pad">エリアはまだありません</div>'}</div>
   <div class="ph-sec">ふりかえり</div>
   <div class="ph-ig">${it('data-msec="review"','review','g-red','週次レビュー',rvAgo==null?'未実施':agoLabel(S.ui.lastReview),rvAgo==null||rvAgo>=7?'warn':'')}${it('data-msec="log"','log','g-gray','完了ログ',doneToday?'今日 '+doneToday:'')}${it('id="mTl"','cal','g-blue','今日のタイムライン','')}</div>
   <div class="ph-sec">アプリ</div>
   <div class="ph-ig">${it('id="mSet"','palette','g-gray','デザイン','')}${it('id="mCfg"','gear','g-gray','設定','')}${it('id="mGuide"','book','g-gray','手引き','')}</div>
   ${S.sample?'<div class="ph-ig"><button class="ph-ir act del" id="mSample">サンプルを消去</button></div>':''}
  </div></div>`;
  $$('[data-msec]',el).forEach(b=>b.onclick=()=>{const s=b.dataset.msec;S.ui.section=s;F.area=null;if(s==='review'&&(S.ui.rvStep||0)>=RV.length-1)S.ui.rvStep=0;save();render()});
  $$('[data-marea]',el).forEach(b=>b.onclick=e=>{const tg=e.target.closest('[data-mtog]');if(tg){e.stopPropagation();S.ui.fold=S.ui.fold||{};S.ui.fold[tg.dataset.mtog]=!S.ui.fold[tg.dataset.mtog];save();renderMain();return}
    F.area=b.dataset.marea;S.ui.section='next';save();render()});
  const mf=$('#mFold',el);if(mf)mf.onclick=()=>{S.ui.fold=S.ui.fold||{};foldables().forEach(t=>{S.ui.fold[t.id]=anyOpen});save();renderMain()};
  $('#mAddArea',el).onclick=()=>openAreaEditor(null);
  $('#mTl',el).onclick=()=>{if(!S.ui.tl)toggleTL()};
  $('#mSet',el).onclick=e=>{e.stopPropagation();openSettings($('#mSet',el))};
  $('#mCfg',el).onclick=e=>{e.stopPropagation();openConfig($('#mCfg',el))};
  $('#mGuide',el).onclick=()=>openGuide();
  const ms=$('#mSample',el);if(ms)ms.onclick=()=>{$('#side')&&renderSide();const cs=$('#clearSample');if(cs){cs.click();if(cs.classList.contains('armed')){ms.textContent='もう一度押すと消去します';ms.onclick=()=>{$('#clearSample').click();render()}}}};
}
function renderMain(){
  if(DR){const r=takeDraft();if(r){r.dr.el.remove();if(r.ok)save()}}
  const c=$('#content');let el=$('#view');
  if(!el){c.innerHTML='<div id="pads" class="pads" hidden></div><div id="view" class="view"></div>';el=$('#view');padSig=''}
  if(S.ui.section==='proj'&&!projMode()){S.ui.section='next'}
  if(S.ui.section==='more'&&!narrow())S.ui.section='next';
  if(S.ui.section==='more')renderMore(el);else if(S.ui.section==='log')renderLog(el);else if(S.ui.section==='review')renderReview(el);else if(S.ui.section==='projects')renderProjects(el);else if(isList())renderList(el);else renderBoard(el);
  renderPads();bindPhScroll();document.body.dataset.sec=S.ui.section;
}
function render(){closePop();renderSide();renderBar();renderMain();renderTabs();if(S.ui.tl)renderTL();$('#tl').classList.toggle('open',S.ui.tl)}

document.addEventListener('keydown',e=>{
  if((MAC?e.metaKey:e.ctrlKey)&&!e.altKey&&!e.shiftKey&&e.key.toLowerCase()==='k'){e.preventDefault();if($('.scrim:not(#capture)')||$('#guide')||$('#cmp'))return;if($('#capture'))$('#capIn').focus();else openCapture();return}
  if(e.target.closest('input,textarea,select')||$('.scrim')||$('#guide')||$('#cmp'))return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key.toLowerCase();
  if(listKeys(e,k))return;
  if(e.key==='?'){e.preventDefault();openGuide();return}
  if(e.key==='/'){e.preventDefault();openSearch();return}
  if(k==='n'){e.preventDefault();const pd=$('#pads .pad');if(pd&&!pd.closest('[hidden]')){const r=pd.getBoundingClientRect();pd.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,button:0,clientX:r.left+5,clientY:r.top+5}));window.dispatchEvent(new PointerEvent('pointerup',{clientX:r.left+5,clientY:r.top+5}))}}
  else if(k==='l'&&S.ui.section!=='log'){S.ui.view='list';save();render()}
  else if(k==='b'&&S.ui.section!=='log'){S.ui.view='board';save();render()}
  else if(k==='t')toggleTL();
  else if('1234567'.includes(k)&&k){S.ui.section=['inbox','today','next','calendar','waiting','someday','tickler'][+k-1];F.area=null;save();render()}
  else if(k==='='||k==='+')stepSize(1);else if(k==='-')stepSize(-1);
});
let wasNarrow=narrow();
window.addEventListener('resize',()=>{if(narrow()!==wasNarrow){wasNarrow=narrow();render();return}if(S.ui.tl)renderTL()});

/* iPhone：シート状の小窓の外をタップしたら、閉じるだけにして下の行を押さない */
document.addEventListener('pointerdown',e=>{if(!narrow())return;const op=$('.fpop,.setpop');if(!op||e.target.closest('.fpop,.setpop,.scrim'))return;
  const sw=ev=>{ev.stopPropagation();ev.preventDefault();window.removeEventListener('click',sw,true)};window.addEventListener('click',sw,true);setTimeout(()=>window.removeEventListener('click',sw,true),600)},true);
let VHINFO={};
/* iPhone / iPad のホーム画面アプリだけが対象。Mac の Safari で「Dock に追加」したアプリには適用しない */
const IOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const fixVH=()=>{const de=document.documentElement;const st=IOS&&(navigator.standalone===true||matchMedia('(display-mode: standalone)').matches);
  const sh=innerHeight>innerWidth?Math.max(screen.width,screen.height):Math.min(screen.width,screen.height);
  const gap=st?Math.round(sh-innerHeight):0;VHINFO={st,sh,ih:innerHeight,gap};
  /* 実機（画面852・表示領域793）で「補正 = ずれ − 45」がぴったりだったので、それを自動の既定値にする */
  const auto=gap>=40&&gap<=80?-45:0;const set=typeof S!=='undefined'&&S&&S.ui&&S.ui.vhAdj!=null&&S.ui.vhAdj!=='';
  const adj=set?+S.ui.vhAdj:auto;VHINFO.adj=adj;VHINFO.auto=!set;
  const g=Math.max(0,gap)+adj;if(st&&g>0&&g<220){de.classList.add('vh-fix');de.style.setProperty('--gap',g+'px')}else{de.classList.remove('vh-fix');de.style.removeProperty('--gap')}};
addEventListener('resize',fixVH);addEventListener('orientationchange',()=>setTimeout(fixVH,350));addEventListener('pageshow',fixVH);
load();fixVH();if(narrow())S.ui.tl=false;applyLook();$('#fab').innerHTML=ic('plus');$('#fab').onclick=openPlus;render();
setTimeout(()=>{$$('.due-b.back').forEach(e=>{const b=e.parentNode;e.remove();if(b&&b.classList.contains('badges')&&!b.children.length)b.remove()})},6100);
fbInit();
})();
</script>
