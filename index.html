<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Fusen</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="application-name" content="Fusen">
<meta name="apple-mobile-web-app-title" content="Fusen">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F8F7F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#222120" media="(prefers-color-scheme: dark)">
<style>html{color-scheme:light;touch-action:manipulation}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Klee+One:wght@400;600&family=M+PLUS+1+Code:wght@400;500;700&family=Shippori+Mincho:wght@600;700&display=swap">
<style>
/* Layout: macOS-style source list | toolbar + board/list canvas | slide-in day timeline */
:root{
  --board:#ECEAE5; --dots:rgba(60,52,40,.14); --win:#F8F7F4; --side:rgba(233,231,226,.82);
  --ink:#1E1D1A; --ink2:#67635B; --ink3:#9A958B; --line:rgba(50,44,32,.10); --line2:rgba(50,44,32,.18);
  --accent:#3A6BD6; --accent-bg:rgba(58,107,214,.12); --sel:rgba(50,44,32,.08); --now:#E0483F;
  --pop:#FFFFFF; --tl:#FBFAF8; --clipbg:#E6D7BE; --scrim:rgba(30,26,20,.28); --stk-filter:none;
  --shadow-pop:0 18px 48px -12px rgba(40,30,10,.28),0 2px 6px rgba(40,30,10,.08);
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --f-note:"Hiragino Maru Gothic ProN","Zen Maru Gothic","Hiragino Sans",var(--f-ui);
  --f-num:"SF Mono",ui-monospace,Menlo,monospace;
  --f-kaku:"Zen Kaku Gothic New",var(--f-ui);--f-hand:"Klee One","Hiragino Maru Gothic ProN",sans-serif;--f-code:"M PLUS 1 Code",ui-monospace,Menlo,monospace;--f-min:"Shippori Mincho","Hiragino Mincho ProN",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --board:#1B1A18; --dots:rgba(255,248,232,.07); --win:#222120; --side:rgba(38,36,33,.86);
  --ink:#EEECE7; --ink2:#A9A59C; --ink3:#78746C; --line:rgba(255,248,232,.08); --line2:rgba(255,248,232,.15);
  --accent:#7AA2F7; --accent-bg:rgba(122,162,247,.16); --sel:rgba(255,248,232,.08); --now:#FF6B5E;
  --pop:#2B2A27; --tl:#242321; --clipbg:#4A4236; --scrim:rgba(0,0,0,.5); --stk-filter:brightness(.9) saturate(.92);
  --shadow-pop:0 18px 48px -12px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --board:#1B1A18; --dots:rgba(255,248,232,.07); --win:#222120; --side:rgba(38,36,33,.86);
  --ink:#EEECE7; --ink2:#A9A59C; --ink3:#78746C; --line:rgba(255,248,232,.08); --line2:rgba(255,248,232,.15);
  --accent:#7AA2F7; --accent-bg:rgba(122,162,247,.16); --sel:rgba(255,248,232,.08); --now:#FF6B5E;
  --pop:#2B2A27; --tl:#242321; --clipbg:#4A4236; --scrim:rgba(0,0,0,.5); --stk-filter:brightness(.9) saturate(.92);
  --shadow-pop:0 18px 48px -12px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.3); color-scheme:dark}

.c-lemon{--s:#FFE48C;--si:#4F3D00;--sd:#E0B41E}
.c-mint{--s:#BFEBD3;--si:#0B4730;--sd:#34B37A}
.c-rose{--s:#FBD0DC;--si:#6A1C36;--sd:#E0668C}
.c-sky{--s:#C8DFFA;--si:#10396A;--sd:#4A8BE0}
.c-lilac{--s:#DDD3FA;--si:#35287A;--sd:#8B72E6}
.c-peach{--s:#FFD4B8;--si:#652A0B;--sd:#EE8A4E}
.c-sage{--s:#DDE7C2;--si:#374710;--sd:#8BA33A}
.c-paper{--s:#F4F1E9;--si:#3A3832;--sd:#A8A397}

html,body{height:100%}
body{background:var(--win);color:var(--ink);font-family:var(--f-ui);font-size:13px;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.app{display:grid;grid-template-columns:268px minmax(0,1fr);height:100%}

/* sidebar */
.side{background:var(--side);padding-inline:8px!important;backdrop-filter:blur(30px) saturate(1.4);-webkit-backdrop-filter:blur(30px) saturate(1.4);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px 10px;gap:2px;overflow-y:auto;min-height:0}
.brand{display:flex;align-items:center;gap:8px;padding:2px 8px 14px;font-weight:600;font-size:14px;letter-spacing:.01em}
.brand i{width:18px;height:18px;border-radius:5px;background:#FFE48C;box-shadow:inset 0 -5px 0 rgba(0,0,0,.06),2px 2px 0 -1px #BFEBD3,4px 4px 0 -2px #FBD0DC;transform:rotate(-6deg)}
.cap{font-size:11px;font-weight:600;color:var(--ink3);padding:14px 8px 5px;letter-spacing:.02em;display:flex;justify-content:space-between;align-items:center}
.cap button{color:var(--ink3);display:flex;border-radius:5px;padding:2px}
.cap-b{display:flex;gap:4px;align-items:center}
.cap button:hover{color:var(--ink);background:var(--sel)}
.nav{display:flex;align-items:center;gap:9px;width:100%;padding:6px 8px;border-radius:7px;color:var(--ink);text-align:left;position:relative;transition:background .15s,box-shadow .15s}
.nav:hover{background:var(--sel)}
.nav.on{background:var(--accent-bg);color:var(--accent)}
.nav .n{margin-left:auto;font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.nav.on .n{color:var(--accent)}
.nav small{display:block;font-size:10.5px;color:var(--ink3);margin-top:1px}
.nav .lbl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav.drop-hot{background:var(--accent);color:#fff;box-shadow:0 0 0 3px var(--accent-bg);transform:scale(1.02)}
.nav.drop-hot .n,.nav.drop-hot small{color:#fff}
.dot{width:10px;height:10px;border-radius:3px;background:var(--sd);flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.nav.area.on{background:var(--sel);color:var(--ink)}
.side-foot{margin-top:auto;padding:12px 8px 2px;font-size:11px;color:var(--ink3);display:flex;flex-direction:column;gap:6px}
.side-foot button{color:var(--accent);text-align:left}
.area-add{display:flex;gap:6px;padding:4px 6px}
.area-add input{flex:1;min-width:0;border:1px solid var(--line2);background:var(--pop);border-radius:6px;padding:4px 7px;font-size:12px}

/* main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--win);flex-wrap:wrap;position:relative;z-index:5}
.bar h1{font-size:17px;font-weight:700;margin:0;letter-spacing:.01em;display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.bar h1 span{font-size:12px;font-weight:500;color:var(--ink3);font-variant-numeric:tabular-nums}
.menu-btn,.bar .menu-btn{display:none}
.seg{display:flex;background:var(--sel);border-radius:8px;padding:2px}
.seg button{display:flex;align-items:center;gap:5px;padding:4px 9px;border-radius:6px;color:var(--ink2);font-size:12px}
.seg button.on{background:var(--pop);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.spacer{flex:1}
.iconbtn{display:flex;align-items:center;justify-content:center;gap:5px;height:28px;min-width:28px;padding:0 8px;border-radius:7px;color:var(--ink2)}
.iconbtn:hover{background:var(--sel);color:var(--ink)}
.iconbtn.on{background:var(--accent);color:#fff}
.bodyrow{flex:1;display:flex;min-height:0}
.content{flex:1;min-width:0;position:relative;display:flex}

/* board */
.board-scroll{flex:1;overflow:auto;background:var(--board);position:relative}
.canvas{position:relative;background-image:radial-gradient(var(--dots) 1.1px,transparent 1.3px);background-size:calc(24px*var(--z)) calc(24px*var(--z))}
.plane{position:absolute;left:0;top:0;transform-origin:0 0}
.stk{position:absolute;width:176px;padding:12px 13px 10px;border-radius:2px 2px 3px 14px/2px 2px 3px 8px;background:var(--s);color:var(--si);
  background-image:linear-gradient(180deg,rgba(0,0,0,.045),rgba(0,0,0,0) 26px),linear-gradient(135deg,rgba(255,255,255,.35),rgba(255,255,255,0) 40%);
  filter:var(--stk-filter);box-shadow:var(--layers,0 0 0 0 transparent),0 1px 1px rgba(40,30,0,.10),0 10px 16px -10px rgba(50,35,0,.35),0 2px 4px -2px rgba(50,35,0,.12);
  transform:rotate(var(--r));transition:transform .28s cubic-bezier(.2,.9,.3,1.25),box-shadow .2s,opacity .28s;
  display:flex;flex-direction:column;gap:6px;cursor:grab;user-select:none;touch-action:none;font-family:var(--f-note)}
.stk::after{content:"";position:absolute;right:0;bottom:0;width:22px;height:22px;background:linear-gradient(315deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.07) 50%,rgba(255,255,255,.3) 56%,rgba(0,0,0,0) 70%);border-radius:0 0 3px 0;pointer-events:none}
.stk:hover{transform:rotate(calc(var(--r)*.4)) translateY(-2px);box-shadow:var(--layers,0 0 0 0 transparent),0 1px 1px rgba(40,30,0,.10),0 16px 22px -12px rgba(50,35,0,.42),0 3px 6px -2px rgba(50,35,0,.14);z-index:2}
.stk-top{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-ui);font-size:10.5px;font-weight:600;opacity:.62;letter-spacing:.03em}
.stk-min{font-family:var(--f-num);font-size:10.5px;letter-spacing:0;font-weight:500;display:flex;align-items:center;gap:3px}
.stk-min svg.i{width:11px;height:11px}
.stk-title{font-size:15px;font-weight:700;line-height:1.38;word-break:break-word;text-wrap:pretty;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;flex:none}
.stk-note{flex:none;white-space:pre-line;font-size:12px;line-height:1.5;opacity:.78;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stk-wait{font-family:var(--f-ui);font-size:11px;opacity:.75;display:flex;gap:4px;align-items:center}
.stk-foot{margin-top:auto;display:flex;align-items:flex-end;gap:6px;padding-top:4px}
.stk-tags{display:flex;flex-wrap:wrap;gap:4px;flex:1}
.stk-tags span{font-family:var(--f-ui);font-size:10px;font-weight:600;padding:2px 6px;border-radius:99px;background:rgba(0,0,0,.07)}
.chk{width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;opacity:.45;flex:none;display:flex;align-items:center;justify-content:center;transition:opacity .15s,background .15s}
.chk svg.i{width:12px;height:12px;stroke-width:2.4;opacity:0}
.chk:hover{opacity:1;background:rgba(255,255,255,.35)}
/* 完了の当たり判定を見た目より広く（約46px） */
.stk .chk,.row .chk{position:relative}
.stk .chk::before{content:'';position:absolute;inset:-13px;border-radius:6px}
.row .chk::before{content:'';position:absolute;inset:-9px;border-radius:10px}
.chk:hover svg.i{opacity:.7}
.stk.gone{opacity:0;transform:rotate(var(--r)) scale(.8) translateY(8px);pointer-events:none;visibility:hidden;transition:opacity .22s,transform .22s,visibility 0s .22s}
.stk.src-hidden{opacity:0;transition:none}
.stk.new{animation:pop .45s cubic-bezier(.2,.9,.3,1.4)}
@keyframes pop{from{transform:rotate(var(--r)) scale(.4);opacity:0}}
.board-empty{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);text-align:center;color:var(--ink3);pointer-events:none;font-size:13px;line-height:1.7}
.board-empty b{display:block;font-family:var(--f-note);font-size:17px;color:var(--ink2);margin-bottom:4px}

/* crumple */
.crumple{animation:crumple .7s cubic-bezier(.5,0,.75,0) forwards!important;pointer-events:none;z-index:50}
.crumple::before{content:"";position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(62deg,rgba(0,0,0,0) 0 9px,rgba(0,0,0,.09) 10px,rgba(255,255,255,.25) 11px,rgba(0,0,0,0) 12px 20px),repeating-linear-gradient(-38deg,rgba(0,0,0,0) 0 13px,rgba(0,0,0,.08) 14px,rgba(0,0,0,0) 15px 26px);opacity:0;animation:creases .7s forwards}
@keyframes crumple{
  0%{transform:rotate(var(--r)) scale(1);border-radius:3px}
  22%{transform:rotate(calc(var(--r) + 5deg)) scale(.96,.9) skewX(3deg);border-radius:10px 22px 8px 18px}
  48%{transform:rotate(calc(var(--r) - 14deg)) scale(.62,.58) skewY(-5deg);border-radius:38% 46% 40% 44%}
  72%{transform:rotate(calc(var(--r) + 40deg)) scale(.34);border-radius:50%;opacity:1}
  100%{transform:rotate(calc(var(--r) + 120deg)) scale(.04) translateY(60px);border-radius:50%;opacity:0}}
@keyframes creases{0%{opacity:0}25%{opacity:.8}100%{opacity:1}}
.crumple>*{animation:squish .5s forwards}
@keyframes squish{to{opacity:0;filter:blur(1.5px)}}

/* list */
.list-scroll{flex:1;overflow:auto;background:var(--win)}
.list{max-width:760px;margin:0 auto;padding:18px 20px 80px}
.lgroup{margin-bottom:22px}
.lgroup h3{font-size:12px;font-weight:600;color:var(--ink2);margin:0 0 6px;display:flex;align-items:center;gap:8px;padding:0 6px}
.lgroup h3 span{color:var(--ink3);font-weight:500;font-variant-numeric:tabular-nums;margin-left:auto}
.row.src-hidden{opacity:.3}
.empty-list{color:var(--ink3);text-align:center;padding:60px 20px;line-height:1.8}
.empty-list b{display:block;font-family:var(--f-note);font-size:17px;color:var(--ink2)}

/* log */
.logday h3{font-size:12px;font-weight:600;color:var(--ink2);margin:0 0 6px;padding:0 6px;display:flex}
.logday h3 span{margin-left:auto;color:var(--ink3);font-weight:500;font-variant-numeric:tabular-nums}
.logrow{display:flex;align-items:center;gap:11px;padding:8px 10px;border-bottom:1px solid var(--line)}
.logrow .ok{width:18px;height:18px;border-radius:50%;background:var(--sd);filter:var(--stk-filter);display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.logrow .ok svg.i{width:11px;height:11px;stroke-width:2.6}
.logrow b{font-weight:500;flex:1;min-width:0;color:var(--ink2);text-decoration:line-through;text-decoration-color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logrow time{font-family:var(--f-num);font-size:11px;color:var(--ink3)}
.logrow button{font-size:11.5px;color:var(--accent);padding:2px 6px;border-radius:5px}
.logrow button:hover{background:var(--accent-bg)}
.log-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:24px}
.log-sum div{background:var(--sel);border-radius:10px;padding:12px 14px}
.log-sum small{display:block;color:var(--ink3);font-size:11px;margin-bottom:3px}
.log-sum b{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}

/* timeline */
.tl{width:0;overflow:hidden;background:var(--tl);border-left:1px solid transparent;display:flex;flex-direction:column;transition:width .38s cubic-bezier(.3,.8,.2,1),border-color .38s;flex:none;position:relative;z-index:4}
.tl.open{width:268px;border-left-color:var(--line)}
.tl-inner{width:268px;display:flex;flex-direction:column;height:100%}
.tl-head{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.tl-head .d{display:flex;align-items:baseline;justify-content:space-between}
.tl-head b{font-size:15px;font-weight:700}
.tl-head .d span{font-size:11.5px;color:var(--ink3)}
.meter{height:5px;border-radius:9px;background:var(--sel);margin-top:10px;overflow:hidden;display:flex}
.meter i{display:block;height:100%;background:var(--sd);filter:var(--stk-filter)}
.tl-sum{display:flex;justify-content:space-between;font-size:11px;color:var(--ink2);margin-top:6px;font-variant-numeric:tabular-nums}
.tl-scroll{flex:1;overflow-y:auto;position:relative;scroll-behavior:auto}
.tl-day{position:relative}
.hour{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.hour span{position:absolute;left:10px;top:-7px;font-family:var(--f-num);font-size:10.5px;color:var(--ink3);background:var(--tl);padding:0 4px;font-variant-numeric:tabular-nums}
.half{position:absolute;left:48px;right:0;border-top:1px dashed var(--line2)}
.tick{position:absolute;left:52px;right:0;border-top:1px dotted var(--line)}
.tick span,.half span{position:absolute;left:-26px;top:-6px;font-family:var(--f-num);font-size:9px;color:var(--ink3);opacity:.75;font-variant-numeric:tabular-nums}
.half span{left:-30px;opacity:1}
.tl-blocks{position:absolute;left:54px;right:10px;top:0;bottom:0}
.now{position:absolute;left:44px;right:0;height:0;border-top:2px solid var(--now);z-index:3;pointer-events:none}
.now::before{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--now)}
.now span{position:absolute;right:8px;top:-17px;font-family:var(--f-num);font-size:10px;color:var(--now);font-weight:600}
.past{position:absolute;left:0;right:0;top:0;background:repeating-linear-gradient(135deg,transparent 0 6px,var(--sel) 6px 7px);opacity:.5;pointer-events:none}
.blk{position:absolute;box-sizing:border-box;border-radius:3px 3px 4px 9px/3px 3px 4px 6px;background:var(--s);color:var(--si);filter:var(--stk-filter);padding:5px 8px;overflow:hidden;cursor:grab;touch-action:none;user-select:none;
  background-image:linear-gradient(180deg,rgba(0,0,0,.045),rgba(0,0,0,0) 14px),linear-gradient(135deg,rgba(255,255,255,.35),rgba(255,255,255,0) 40%);
  box-shadow:0 1px 1px rgba(40,30,0,.10),0 6px 10px -7px rgba(50,35,0,.35);display:flex;gap:7px;align-items:flex-start;transition:opacity .2s,box-shadow .15s;font-family:var(--f-note)}
.blk:hover{box-shadow:0 1px 1px rgba(40,30,0,.10),0 10px 16px -8px rgba(50,35,0,.42)}
.blk .chk{width:16px;height:16px;margin-top:1px}
.blk .chk svg.i{width:10px;height:10px}
.blk .bt{min-width:0;flex:1}
.blk b{display:block;font-size:12.5px;font-weight:700;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk time{display:block;font-family:var(--f-num);font-size:10px;opacity:.7;margin-top:1px}
.blk.short{align-items:center;padding-block:0}
.blk.short time{display:none}
.blk .rsz{position:absolute;left:0;right:0;bottom:0;height:7px;cursor:ns-resize}
.blk .rsz::after{content:"";position:absolute;left:50%;bottom:2px;width:22px;height:3px;margin-left:-11px;border-radius:3px;background:currentColor;opacity:0;transition:opacity .15s}
.blk:hover .rsz::after{opacity:.3}
.blk.src-hidden{opacity:.28}
.blk.done-blk{opacity:.5}
.blk.done-blk b{text-decoration:line-through}
.tl-hint{position:absolute;left:54px;right:10px;border:1.5px dashed var(--accent);border-radius:8px;background:var(--accent-bg);pointer-events:none;display:none}
.tl.drop-on .tl-scroll{background:linear-gradient(var(--accent-bg),var(--accent-bg))}

/* ghost */
.ghost{position:fixed!important;left:0;top:0;z-index:1000;pointer-events:none;margin:0;transform-origin:0 0;
  transform:scale(var(--gz,1)) rotate(-1deg);box-shadow:0 2px 3px rgba(40,30,0,.12),0 26px 40px -16px rgba(40,30,0,.5)!important;
  transition:width .2s cubic-bezier(.3,.8,.2,1),height .2s cubic-bezier(.3,.8,.2,1),border-radius .2s,transform .2s,padding .2s}

.zchip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 9px;border-radius:99px;background:var(--pop);border:1px solid var(--ink);color:var(--ink);font-weight:500}
.zchip svg.i{width:11px;height:11px}
.zchip.inf{border-style:dashed;border-color:var(--ink3);color:var(--ink2);font-weight:400}
.zchip.more{border-color:var(--line2);color:var(--ink3)}
.zchip:hover{background:var(--sel)}

/* pads & draft */
.view{flex:1;display:flex;min-width:0;min-height:0;position:relative}
.pads{flex:none;width:72px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:26px;padding:16px 0 26px;background:var(--win);border-right:1px solid var(--line);overflow-y:auto;scrollbar-width:none;position:relative;z-index:3}
.pad{--s2:color-mix(in srgb,var(--s) 88%,#7a5a2a);--s3:color-mix(in srgb,var(--s) 78%,#7a5a2a);--edge:rgba(60,40,0,.18);width:44px;height:44px;flex:none;position:relative;cursor:grab;touch-action:none;border-radius:2px 2px 2px 7px;background:var(--s);filter:var(--stk-filter);
  background-image:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,0) 10px);
  box-shadow:2px 2px 0 -.5px var(--s2),2px 2px 0 .5px var(--edge),4px 4px 0 -1px var(--s3),4px 4px 0 0 var(--edge),6px 6px 0 -1.5px var(--s3),6px 6px 0 -.5px var(--edge),0 8px 10px -6px rgba(50,35,0,.45);transition:transform .18s cubic-bezier(.2,.9,.3,1.4)}
.pad::after{content:"";position:absolute;right:0;bottom:0;width:12px;height:12px;background:linear-gradient(315deg,transparent 45%,rgba(0,0,0,.08) 50%,rgba(255,255,255,.4) 58%,transparent 72%);transition:all .18s}
.pad:hover{transform:translateY(-2px) rotate(-4deg)}
.pad:hover::after{width:20px;height:20px}
.pad:active{cursor:grabbing}
.pad span{position:absolute;top:52px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--ink2);white-space:nowrap;max-width:60px;overflow:hidden;text-overflow:ellipsis;filter:none}
.stk.draft{cursor:text;box-shadow:var(--layers,0 0 0 0 transparent),0 0 0 2px color-mix(in srgb,var(--sd) 55%,transparent),0 18px 28px -14px rgba(50,35,0,.5)}
.stk.draft:hover{transform:rotate(var(--r))}
.draft-title{border:0;background:transparent;resize:none;outline:none;font-family:var(--f-note);font-size:15px;font-weight:700;line-height:1.38;color:inherit;width:100%;padding:0;min-height:44px;overflow:hidden}
.draft-title::placeholder{color:currentColor;opacity:.4}
.stk.settle{animation:settle .35s ease-out}
@keyframes settle{from{transform:rotate(var(--r)) translateY(-3px) scale(1.02)}}
.tray{position:fixed;z-index:950;width:286px;background:var(--pop);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow-pop);padding:10px 12px 8px;display:flex;flex-direction:column;gap:8px;font-size:11.5px;animation:rise .22s cubic-bezier(.2,.9,.3,1.1)}
.tr{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.tr>b{font-weight:600;color:var(--ink3);font-size:10.5px;width:30px;flex:none}
.tr .c{display:flex;align-items:center;gap:4px;padding:3px 8px;border-radius:99px;border:1px solid var(--line2);color:var(--ink2);font-size:11px}
.tr .c svg.i{width:12px;height:12px}
.tr .c:hover{color:var(--ink);border-color:var(--ink3)}
.tr .c.on{background:var(--ink);color:var(--win);border-color:var(--ink)}
.tr-foot{display:flex;justify-content:space-between;color:var(--ink3);font-size:10.5px;border-top:1px solid var(--line);padding-top:6px}
@media (max-width:760px){.pads{width:60px}}

/* pads follow sticky style */
body:not(.sty-classic) .pad::after{display:none}
body:not(.sty-classic) .pad{background-image:none}
body.sty-tape .pad,body.sty-minimal .pad,body.sty-grid .pad,body.sty-pola .pad,body.sty-receipt .pad,body.sty-index .pad{--s2:#F3F0E8;--s3:#E7E3DA;--edge:rgba(0,0,0,.13)}
body.sty-tape .pad{background:#FFFDF7;border-radius:2px}
body.sty-tape .pad::before{content:"";position:absolute;top:-5px;left:10px;width:24px;height:9px;background:color-mix(in srgb,var(--sd) 60%,transparent);transform:rotate(-5deg);mix-blend-mode:multiply}
body.sty-glass .pad{background:color-mix(in srgb,var(--s) 38%,rgba(255,255,255,.55));border:1px solid rgba(255,255,255,.85);border-radius:10px;filter:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),4px 4px 0 -1px color-mix(in srgb,var(--s) 25%,rgba(255,255,255,.6)),0 8px 14px -8px rgba(40,30,90,.35)}
body.sty-minimal .pad{--s2:var(--mn-bg);--s3:var(--mn-bg);--edge:var(--mn-line);background:var(--mn-bg);border:1px solid var(--mn-line);border-radius:9px;filter:none;box-shadow:3px 3px 0 -1px var(--mn-bg),3px 3px 0 0 var(--mn-line),6px 6px 0 -1px var(--mn-bg),6px 6px 0 0 var(--mn-line)}
body.sty-minimal .pad::before{content:"";position:absolute;left:7px;top:7px;width:7px;height:7px;border-radius:50%;background:var(--sd)}
body.sty-grid .pad{background-color:#FFFFFB;background-image:linear-gradient(#DCE7F0 1px,transparent 1px),linear-gradient(90deg,#DCE7F0 1px,transparent 1px);background-size:6px 6px;border-radius:2px}
body.sty-grid .pad::before{content:"";position:absolute;left:6px;right:6px;top:15px;height:8px;background:color-mix(in srgb,var(--sd) 45%,transparent)}
body.sty-ticket .pad{background:linear-gradient(90deg,var(--s) 0 30px,#FFFDF6 30px);border-radius:4px}
body.sty-ticket .pad::before{content:"";position:absolute;left:30px;top:3px;bottom:3px;border-left:1px dashed color-mix(in srgb,var(--sd) 60%,transparent)}
body.sty-pola .pad{background:linear-gradient(var(--s),var(--s)) 4px 4px/36px 28px no-repeat,#FFFFFD;border-radius:1px}
body.sty-receipt .pad{background:#FBFAF6 repeating-linear-gradient(transparent 0 7px,#D6D6D0 7px 8px);border-radius:0}
body.sty-receipt .pad::before{content:"";position:absolute;left:0;right:0;top:4px;height:3px;background:var(--sd);opacity:.7}
body.sty-index .pad{background:#FFFEFA repeating-linear-gradient(transparent 0 7px,#BFD4EE 7px 8px);border-top:4px solid var(--sd);box-sizing:border-box;border-radius:1px}

 background:color-mix(in srgb,#FFE48C 34%,var(--pop));box-shadow:0 0 0 1px rgba(200,150,20,.32),0 6px 14px -10px rgba(120,80,0,.45);transition:box-shadow .15s,transform .15s,background .15s}

.sw-grid{background:#E3E8EE}
.sw-grid i{background:#FFFFFB linear-gradient(#DCE7F0 1px,transparent 1px) 0 0/5px 5px;box-shadow:0 4px 6px -3px rgba(0,0,0,.3)}

/* ---- guide ---- */
.guide{--gp:#F6F1E7;--gi:#24201A;--gm:#6B6356;--gl:rgba(60,45,20,.14);--gk:#B4561A;--gcard:#FFFDF8;--gdark:#1F1C17;--gdi:#F3EDE1;position:fixed;inset:0;z-index:990;overflow-y:auto;background:var(--gp);color:var(--gi);animation:gin .35s cubic-bezier(.2,.8,.2,1)}

.cmp>*{flex-shrink:0}
.cmp{position:fixed;inset:0;z-index:940;overflow-y:auto;background:linear-gradient(180deg,color-mix(in srgb,var(--board) 45%,var(--win)) 0%,var(--board) 100%);animation:cmpIn .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;align-items:center;padding:34px 40px 26px;box-sizing:border-box;transition:opacity .25s}

.cmp-x{position:fixed;right:22px;top:calc(18px + env(safe-area-inset-top,0px));width:36px;height:36px;border-radius:50%;background:color-mix(in srgb,var(--pop) 80%,transparent);display:flex;align-items:center;justify-content:center;color:var(--ink2);z-index:2;box-shadow:0 2px 6px rgba(0,0,0,.08)}

.cmp-note{grid-column:2;position:relative;width:340px;min-height:256px;padding:26px 26px 16px;box-sizing:border-box;border-radius:3px 3px 4px 26px/3px 3px 4px 15px;background-color:var(--s);color:var(--si);background-image:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,0) 40px),linear-gradient(135deg,rgba(255,255,255,.45),rgba(255,255,255,0) 45%);box-shadow:0 2px 3px rgba(0,0,0,.12),0 36px 50px -26px rgba(80,40,0,.5);transform:rotate(-1.4deg);display:flex;flex-direction:column;font-family:var(--f-note);transition:background-color .3s,color .3s,transform .3s,box-shadow .2s;touch-action:none;cursor:grab;user-select:none}
.cmp-note::after{content:"";position:absolute;right:0;bottom:0;width:40px;height:40px;background:linear-gradient(315deg,transparent 45%,rgba(0,0,0,.08) 50%,rgba(255,255,255,.5) 57%,transparent 72%);pointer-events:none}
.cmp-note.dragging{transition:none;cursor:grabbing;box-shadow:0 2px 3px rgba(0,0,0,.12),0 46px 60px -24px rgba(80,40,0,.55);z-index:5}
.cmp-tabs{position:absolute;top:-21px;left:16px;display:flex;gap:5px}
.cmp-tab{min-width:46px;max-width:76px;height:24px;padding:4px 9px 0;box-sizing:border-box;border-radius:6px 6px 0 0;background:var(--s);color:var(--si);font-family:var(--f-ui);font-size:10px;font-weight:700;opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;box-shadow:inset 0 -6px 6px -4px rgba(0,0,0,.14);transition:height .15s,margin .15s,opacity .15s;filter:var(--stk-filter);align-self:flex-end}
.cmp-tab:hover{height:28px;opacity:1}
.cmp-tab.on{height:32px;opacity:1;color:var(--si)}
.cmp-nl{display:flex;justify-content:space-between;font-family:var(--f-ui);font-size:11px;font-weight:700;opacity:.62;letter-spacing:.06em;min-height:15px}
.cmp-title,.cmp-memo{border:0;background:none;outline:none;resize:none;color:inherit;padding:0;width:100%;overflow:hidden;cursor:text;user-select:text}

.cmp-q{width:min(600px,100%);background:var(--pop);border-radius:22px;padding:18px 20px 16px;box-shadow:0 26px 50px -26px rgba(60,40,10,.5);border:1px solid color-mix(in srgb,#B4561A 18%,transparent);position:relative;animation:rise .25s cubic-bezier(.2,.9,.3,1.1)}

.cmp-q .qt{font-family:var(--f-min);font-size:21px;font-weight:700;margin:4px 0 12px}
.qopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}

.cmp-th{width:100%;max-width:1000px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink3);margin:18px 0 12px;padding:0 8px;box-sizing:border-box;min-height:32px}
.cmp-qb{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:99px;background:var(--pop);color:#B4561A;font-weight:700;font-size:12.5px;box-shadow:0 4px 12px -6px rgba(180,86,26,.5);border:1px solid rgba(180,86,26,.25)}
.cmp-qb:hover{background:#B4561A;color:#fff}
.cmp-trays{width:100%;max-width:1000px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.ctray{position:relative;height:178px;text-align:left;transition:transform .22s cubic-bezier(.2,.9,.3,1.3),opacity .2s,filter .2s}
.ctray .tback{position:absolute;left:8px;right:8px;top:0;height:104px;border-radius:14px 14px 0 0;background:linear-gradient(180deg,color-mix(in srgb,var(--pop) 75%,transparent),color-mix(in srgb,var(--pop) 25%,transparent));box-shadow:inset 0 2px 0 color-mix(in srgb,var(--pop) 90%,transparent)}
.ctray .tfront{position:absolute;left:0;right:0;top:50px;bottom:0;border-radius:16px;background:var(--pop);box-shadow:0 18px 26px -18px rgba(60,40,10,.55),inset 0 -3px 0 rgba(0,0,0,.05);padding:14px 14px 12px;display:flex;flex-direction:column;gap:4px;border-top:5px solid var(--c);box-sizing:border-box;transition:box-shadow .2s}

.ctray.dim{opacity:.32;filter:saturate(.4)}
.ctray.hint .tfront{box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 40%,transparent),0 18px 26px -18px rgba(60,40,10,.55)}

/* ---------- task editor (inspector rows) ---------- */
.sheet.ed{width:min(480px,100%);max-height:86vh;background:var(--win);border-radius:16px;position:relative}

.ed-ck.on{background:var(--sd)}.ed-ck.on svg.i{opacity:1;color:#fff}

.ed-tx{flex:1;min-width:0}
.sheet.ed textarea{background:none;border-radius:0;min-height:0;padding:0;resize:none;box-sizing:border-box}

.erv.mute{font-weight:400;color:var(--ink3)}
.erv.warn{color:var(--orange,#E8702A)}
.erv.need{color:var(--now);font-weight:600}
.erc{display:flex;color:var(--ink3);opacity:.7}.erc svg.i{width:14px;height:14px;transform:rotate(-90deg)}

.po svg.i{width:15px;height:15px;color:var(--ink2);flex:none}
.po .dot{width:9px;height:9px;border-radius:2.5px;flex:none}

.pol{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.pck{display:flex;opacity:0;color:var(--accent)}.pck svg.i{width:14px;height:14px;color:var(--accent);stroke-width:2.4}
.po.on .pck{opacity:1}.po.on .pol{color:var(--accent);font-weight:600}
.pg-sep{display:block;height:6px;background:var(--win);box-shadow:inset 0 1px 0 var(--line),inset 0 -1px 0 var(--line)}
.prow2{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);flex-wrap:wrap}.prow2 svg.i{width:14px;height:14px}

.pgrip{display:flex;color:var(--ink3)}.pgrip svg.i{width:13px;height:13px}
.po.psep .pol{color:var(--ink3);font-size:12px;display:flex;align-items:center;gap:8px}.po.psep .pol::after{content:"";flex:1;border-top:1.5px dashed var(--line2)}
.pdel{display:flex;align-items:center;color:var(--ink3);padding:3px 5px;border-radius:6px;font-size:11.5px;font-weight:600}.pdel svg.i{width:13px;height:13px}

function parse(raw){
  let s=raw,tags=[],labels=[],mins=null,ar=null;
  s=s.replace(/#(\S+)/g,(m,n)=>{const g=TAGS.find(x=>x.name===n||x.id===n);if(g){tags.push(g.id);return ''}const lb=(S.labels||[]).find(x=>x.name===n);if(lb){labels.push(lb.id);return ''}return m});
  s=s.replace(/(\d+(?:\.\d+)?)\s*(時間|h)(?![a-z])/i,(m,n)=>{mins=Math.round(+n*60);return ''});
  s=s.replace(/(\d+)\s*(min|分|m)(?![a-z])/i,(m,n)=>{mins=+n;return ''});
  s=s.replace(/@(\S+)/,(m,n)=>{const a=S.areas.find(x=>x.name===n);if(a){ar=a.id;return ''}return m});

  return {title:s.trim(),tags,labels,mins,area:ar,agenda};
}

/* サイドバーの条件リストを上下ドラッグで並べ替え（順番は同期される） */
function viewReorderDown(e,b){
  if(e.button!==0)return;const sy=e.clientY,sibs=$$('#side [data-vw]');if(sibs.length<2)return;
  const idx=sibs.indexOf(b);let on=false,to=idx,line=null;
  const rects=sibs.map(x=>x.getBoundingClientRect()),sideR=$('#side').getBoundingClientRect();
  const mv=ev=>{const dy=ev.clientY-sy;
    if(!on&&Math.abs(dy)>6){on=true;b.classList.add('reorder');document.body.classList.add('is-dragging');line=document.createElement('div');line.className='area-ins';$('#side').appendChild(line)}
    if(!on)return;b.style.transform=`translateY(${dy}px)`;
    to=0;rects.forEach((r,i)=>{if(i!==idx&&ev.clientY>(r.top+r.bottom)/2)to++});
    const others=rects.filter((_,i)=>i!==idx);const y=to<others.length?others[to].top-1:others[others.length-1].bottom+1;
    line.style.top=(y-sideR.top+$('#side').scrollTop)+'px';line.style.left='14px'};
  const up=()=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);document.body.classList.remove('is-dragging');
    if(!on)return;b._dragged=true;b.style.transform='';b.classList.remove('reorder');line&&line.remove();
    if(to===idx)return;
    const ids=sibs.map(x=>x.dataset.vw);const [m]=ids.splice(idx,1);ids.splice(to,0,m);
    /* 表示中のものだけ並べ替え、隠しているものはそのままの位置に残す */
    const shown=new Set(ids);let k=0;S.views=(S.views||[]).map(v=>shown.has(v.id)?viewOf(ids[k++]):v);save();render()};
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);

  if(!v||!t||isProj(t)||t.status==='done'||queued(t))return false;
  const ss=vSts(v);if(tickled(t)?!ss.includes('tickler'):!ss.includes(t.status))return false;
  if(t.status==='calendar'&&t.info&&t.cdate&&t.cdate<todayKey())return false;
  if(v.areas&&v.areas.length&&!v.areas.some(a=>inArea(t,a)))return false;
  if(!anyAll(t.tags||[],v.places,v.placesAll))return false;
  if(!anyAll(t.labels||[],v.labels,v.labelsAll))return false;
  if(v.energy&&v.energy.length&&!v.energy.includes(t.energy))return false;
  if(v.time&&!timeOk(t,v.time))return false;
  if(v.people&&v.people.length&&!pplOk(t,new Set(v.people)))return false;
  const df=v.due&&DUEF.find(x=>x.id===v.due);if(df){const dd=t.status==='calendar'?t.cdate:t.due;if(!dd||!df.f(dayDiff(dd)))return false}
  return true}
const vCount=v=>S.tasks.filter(t=>vMatch(t,v)).length;
function viewSum(v){if(!v)return '';const o=[vSts(v).map(s=>VST.find(x=>x[0]===s)[1].replace(' Action','')).join('・')];
  if(v.areas&&v.areas.length)o.push(v.areas.map(a=>area(a)?.name).filter(Boolean).join('・'));
  if(v.people&&v.people.length)o.push(v.people.map(pName).filter(Boolean).join('・'));
  if(v.places&&v.places.length)o.push(v.places.map(tagName).filter(Boolean).join(v.placesAll?'＋':'・'));
  const tf=v.time&&TIMEF.find(x=>x.id===v.time);if(tf)o.push(tf.none?'所要時間 未設定':tf.l);
  if(v.energy&&v.energy.length)o.push(v.energy.map(e=>ENERGY.find(x=>x.id===e)?.l).filter(Boolean).join('・'));
  if(v.labels&&v.labels.length)o.push(v.labels.map(l=>'#'+labName(l)).join(v.labelsAll?'＋':'・'));
  const df=v.due&&DUEF.find(x=>x.id===v.due);if(df)o.push('締切 '+df.l.replace('（遅れを含む）',''));
  return o.filter(Boolean).join(' / ')}

/* 完了タスクの保存期間（日数）。0 は自動で消さない。同期している端末で共有する */
const KEEP=[[30,'1か月'],[14,'2週間'],[7,'1週間'],[3,'3日'],[1,'1日'],[0,'消さない']];
const keepDays=()=>S.ui.logKeep==null?30:+S.ui.logKeep;

function purgeOld(){const d=keepDays();if(!d)return null;const cut=Date.now()-d*864e5;
  const gone=S.tasks.filter(t=>t.status==='done'&&t.doneAt&&t.doneAt<cut);if(!gone.length)return null;
  const ids=new Set(gone.map(t=>t.id)),links=[];
  S.tasks.forEach(t=>{if(t.project&&ids.has(t.project)&&!ids.has(t.id)){links.push([t,t.project]);t.project=null}});
  S.tasks=S.tasks.filter(t=>!ids.has(t.id));return {gone,links}}
function renderLog(el){

  const wk=done.filter(x=>Date.now()-x.doneAt<7*864e5);

  const label=k=>{if(k===tk)return '今日';const d=new Date(k+'T00:00');const y=new Date();y.setDate(y.getDate()-1);if(k===dayKey(y))return '昨日';return (d.getMonth()+1)+'月'+d.getDate()+'日（'+'日月火水木金土'[d.getDay()]+'）'};

   <div class="log-sum"><div><small>今日 完了</small><b>${today.length}件</b></div><div><small>今日の作業時間</small><b>${fmtMin(today.reduce((s,x)=>s+(x.minutes||0),0))}</b></div><div><small>過去7日間</small><b>${wk.length}件</b></div></div>
   ${done.length?Object.keys(by).map(k=>`<div class="lgroup logday"><h3>${label(k)}<span>${by[k].length}件</span></h3>${by[k].map((x,i)=>`<div class="logrow ${colorOf(x.t)}"><span class="ok">${ic('log')}</span><div class="lt"><b>${esc(x.title)}</b>${x.parent?`<small>${ic('clip')}${esc(x.parent)}</small>`:''}${x.proj?`<small>${ic('clip')}プロジェクト完了</small>`:''}</div><time>${fmtShort(x.minutes)} · ${tm(x.doneAt)}</time><button data-restore="${k}|${i}">戻す</button><button class="ldel" data-ldel="${k}|${i}" title="ログから削除" aria-label="ログから削除">${ic('x')}</button></div>`).join('')}</div>`).join('')
   :'<div class="empty-list"><b>まだ完了したタスクはありません</b>付箋の丸をクリックすると、くしゃっと丸めてここに記録します。</div>'}
   <div class="log-purge"><small>${keepDays()?`完了から${keepLabel()}を過ぎたタスクは自動で削除されます`:'完了したタスクは自動では削除されません'}（設定で変更できます）</small></div>
  </div></div>`;
  /* ログから消す（元に戻せる）。完了済みプロジェクトを消すときは、中のタスクのつながりも外して覚えておく */

    save();render();toast(SECT[x.t.status].en+' に戻しました')});

     <ul class="g-ex"><li>メールに一言返す</li><li>日程の候補に返信する</li><li>書類を所定の場所に入れる</li><li>予約の電話を一本かける</li></ul>

     <div class="g-card"><h3>${ic('flag')}締切は、締切の欄へ</h3><p>締切は「いつまでに」という事実です。Fusen では締切の欄に入れておけば、近づくと Today に浮かび上がります。カレンダーを汚さずに、見落としも防げます。</p></div>
     <div class="g-card"><h3>${ic('next')}次の一歩は、動詞で</h3><p>「企画書」と書かれた付箋の前では、手が止まります。「構成案を3行メモする」なら始められます。見ただけで体が動く行動を書きましょう。</p></div>
     <div class="g-card"><h3>${ic('inbox')}気になったら、また書く</h3><p>ふと思い出してモヤモヤしたら、それは書き漏れの合図です。考え込む前に、まず Inbox へ。</p></div>

   <section class="g-wish">

    <p>創造に必要なのは、何にも追われていない時間と、空いている頭です。だから Fusen は、こなすべき仕事のストレスをできるだけ小さくして、<b>ストレスのない時間をできるだけ多くつくること</b>を目指します。</p>
    <p>付箋をくしゃっと丸めるたびに、少しずつ余白が増えていく。その余白で考え、試し、ときにぼんやりしながら、まだ世界にないものを生み出す。</p>
    <p class="g-last">書き出して、手放して、<br>創造する時間を。</p>
   </section>
   <footer class="g-foot">参考：David Allen『Getting Things Done』（邦題『はじめてのGTD ストレスフリーの整理術』）</footer>
  </article>`;
  document.body.appendChild(g);

/* ---------- weekly review ---------- */
const agoLabel=ms=>{const n=-dayDiff(dayKey(new Date(ms)));return n<=0?'今日':n===1?'昨日':n+'日前'};
const RV=[
 {id:'inbox',l:'Inbox を空にする',d:'頭の外に出したものを、1枚ずつ置き場所へ移します。2分で終わるものは、いまやってしまいましょう。'},
 {id:'proj',l:'プロジェクトの次の一手',d:'すべてのプロジェクトに、次にやる具体的な行動があるかを確かめます。止まっているものから順に並んでいます。'},
 {id:'waiting',l:'Waiting を確かめる',d:'返事が届いたもの、催促したほうがいいものはありませんか。'},
 {id:'next',l:'Next Action を見直す',d:'もう要らないもの、すでに終わっているもの、いまはやらないものを片付けます。'},
 {id:'someday',l:'Someday を眺める',d:'いま始めたくなったものは Next へ。気持ちが離れたものは手放してかまいません。'},
 {id:'ahead',l:'これからの2週間',d:'予定・締切・Tickler から戻ってくるものを、先に眺めておきます。'},
 {id:'end',l:'完了',d:''}
];
const areaRank=t=>{const r=rootOf(area(t.area));const i=r?tops().indexOf(r):-1;return i<0?999:i};
const rvList={
 inbox:()=>S.tasks.filter(t=>t.status==='inbox'&&!isProj(t)),
 waiting:()=>S.tasks.filter(t=>t.status==='waiting'&&!isProj(t)).sort((a,b)=>(a.created||0)-(b.created||0)),
 next:()=>S.tasks.filter(t=>t.status==='next'&&!isProj(t)&&!tickled(t)).sort((a,b)=>areaRank(a)-areaRank(b)||(a.created||0)-(b.created||0)),
 someday:()=>S.tasks.filter(t=>t.status==='someday'&&!isProj(t))
};
const rvCount=id=>id==='proj'?projects().filter(p=>projState(p).k==='stuck').length:rvList[id]?rvList[id]().length:0;
const RVA={now:'2分でやった',next:'Next',waiting:'Waiting',someday:'Someday',tickler:'Tickler',done:'完了',del:'削除',open:'開く'};
function rvRow(t,acts,meta){
  const a=area(t.area),P=isChild(t)?projOf(t):null;
  const sub=[a?areaLabel(a):'',P?P.title:'',meta||''].filter(Boolean).map(esc).join(' · ');
  return `<div class="rv-row ${colorOf(t)}" data-id="${t.id}"><span class="dot"></span><div class="rv-t" role="button" tabindex="0"><b>${isProj(t)?ic('clip'):''}${esc(t.title)}</b>${sub?`<small>${sub}</small>`:''}</div><div class="rv-acts">${acts.map(k=>`<button class="rv-a ${k==='del'?'del':''}" data-act="${k}">${RVA[k]}</button>`).join('')}</div></div>`;
}
function rvProjRow(p){
  const st=projState(p),na=nextAction(p),a=area(p.area);
  return `<div class="rv-row c-${areaColor(a)}" data-pid="${p.id}"><span class="dot"></span><div class="rv-t" role="button" tabindex="0"><b>${ic('clip')}${esc(p.title)}</b><small class="${st.k==='stuck'?'warn':''}">${na?'次の一手：'+esc(na.title):esc(st.l)}</small></div><div class="rv-acts"><button class="rv-a ${st.k==='stuck'?'pri':''}" data-pact="add">次の一手を書く</button><button class="rv-a" data-pact="open">開く</button><button class="rv-a" data-pact="done">完了</button></div></div>`;
}
function rvBody(id){
  const ok=m=>`<div class="rv-ok">${ic('log')}${m}</div>`;
  if(id==='inbox'){const L=rvList.inbox();return L.length?L.map(t=>rvRow(t,['now','next','waiting','someday','tickler','del'],t.note?t.note.slice(0,40):'')).join(''):ok('Inbox は空です')}
  if(id==='proj'){const L=projects().sort((a,b)=>(projState(a).k==='stuck'?0:1)-(projState(b).k==='stuck'?0:1));return L.length?L.map(rvProjRow).join(''):ok('進行中のプロジェクトはありません')}
  if(id==='waiting'){const L=rvList.waiting();return L.length?L.map(t=>{const n=-dayDiff(dayKey(new Date(t.created||Date.now())));return rvRow(t,['done','next','open'],(whoTxt(t)?whoTxt(t)+' · ':'')+(n>0?`登録から${n}日`:'今日登録'))}).join(''):ok('待っているものはありません')}
  if(id==='next'){const L=rvList.next();return L.length?L.map(t=>rvRow(t,['done','someday','del','open'],t.due?dlLabel(t.due).l:'')).join(''):ok('Next Action は空です')}

}
function rvAct(t,k,btn){
  const was={status:t.status,area:t.area,minutes:t.minutes,start:t.start};
  const undo=()=>{Object.assign(t,was);save();render()};
  const needArea=()=>{if(t.status!=='inbox'&&!area(t.area)&&S.areas.length){save();render();openEditor(t,null,'エリアを選んでください');return true}return false};
  if(k==='open'){isProj(t)?openProject(t.id):openEditor(t);return}
  if(k==='now'||k==='done'){finishComplete({t});return}
  if(k==='del'){if(!btn.classList.contains('armed')){btn.classList.add('armed');btn.textContent='本当に削除';return}
    const i=S.tasks.indexOf(t);S.tasks.splice(i,1);save();render();toast('削除しました',{label:'元に戻す',fn:()=>{S.tasks.splice(Math.min(i,S.tasks.length),0,t);save();render()}});return}
  if(k==='tickler'){openStartPop(btn,t.start,v=>{t.start=v;if(t.status==='inbox'||t.status==='someday'){t.status='next';}if(needArea())return;save();render();toast(`${dueLabel(v).l} まで Tickler にしまいました`,{label:'元に戻す',fn:undo})});return}
  t.status=k;t.start=null;;
  if(needArea())return;
  save();render();toast(`${SECT[k].en} に移動しました`,{label:'元に戻す',fn:undo});
}

/* 1件ずつ「最後に同期した内容（SB.h）」と比べて、どちらで変わったかを判断する */
function reconcile(id,rj,cur,setLocal,delLocal,allowDel){
  const r=hj(rj),b=SB.h[id],l=cur==null?null:hj(cur);
  if(r===b)return false;
  if(rj==null){if(b===undefined||!allowDel)return false;let ch=false;if(l===b){delLocal();ch=true}delete SB.h[id];return ch}
  let ch=false;if(l!==r){setLocal(rj);ch=true}SB.h[id]=r;return ch;
}
function afterRemote(ch){if(purgeOld())ch=true;if(ch){saveLocal();remoteRender()}SYNC.ready=true;if(SYNC.state==='err'&&navigator.onLine)SYNC.state='sync';saveSB();pushNow();syncUI()}
function attach(){
  const {FS}=FB;let srv=false;
  FB.unsub.push(FS.onSnapshot(tcol(),{includeMetadataChanges:true},snap=>{
    if(!snap.metadata.fromCache)srv=true;
    const rem=new Map(snap.docs.map(d=>[d.id,d.data().j]));
    const loc=new Map(S.tasks.map(t=>[t.id,t]));
    const ids=new Set([...rem.keys(),...Object.keys(SB.h).filter(k=>k!=='__meta'),...loc.keys()]);
    let ch=false;
    ids.forEach(id=>{const t=loc.get(id);
      ch=reconcile(id,rem.has(id)?rem.get(id):null,t?JSON.stringify(t):null,
        rj=>{const o=fixTask(JSON.parse(rj));if(t){Object.keys(t).forEach(k=>delete t[k]);Object.assign(t,o)}else S.tasks.push(o)},
        ()=>{const i=S.tasks.indexOf(t);if(i>=0)S.tasks.splice(i,1)},srv)||ch});
    SYNC.pT=snap.metadata.hasPendingWrites;afterRemote(ch);
  },syncErr));
  FB.unsub.push(FS.onSnapshot(mref(),{includeMetadataChanges:true},snap=>{
    const ch=snap.exists()?reconcile('__meta',snap.data().j,metaJ(),setMeta,()=>{},false):false;
    SYNC.pM=snap.metadata.hasPendingWrites;if(ch)padSig='';afterRemote(ch);
  },syncErr));
}
function pushNow(){
  if(!SYNC.ready||!SYNC.user||!FB)return;
  const {FS}=FB,ops=[],loc=new Set();
  S.tasks.forEach(t=>{loc.add(t.id);const j=JSON.stringify(t),h=hj(j);if(SB.h[t.id]!==h){ops.push([FS.doc(tcol(),t.id),j]);SB.h[t.id]=h}});
  Object.keys(SB.h).forEach(id=>{if(id==='__meta'||loc.has(id))return;ops.push([FS.doc(tcol(),id),null]);delete SB.h[id]});
  const mj=metaJ(),mh=hj(mj);if(SB.h.__meta!==mh){ops.push([mref(),mj]);SB.h.__meta=mh}
  if(!ops.length)return;saveSB();
  for(let i=0;i<ops.length;i+=400){const b=FS.writeBatch(FB.db);ops.slice(i,i+400).forEach(([r,j])=>j==null?b.delete(r):b.set(r,{j,t:Date.now()}));b.commit().catch(syncErr)}
  SYNC.pT=true;syncUI();
}

   <div class="ph-ig">${it('data-msec="inbox"','inbox','g-inbox','Inbox',cnt('inbox'))}${it('data-msec="today"','today','g-today','Today',cnt('today'))}${it('data-msec="next"','next','g-next','Next Action',cnt('next'))}${it('data-msec="calendar"','calendar','g-calendar','Calendar',cnt('calendar'))}</div>
   <div class="ph-ig">${it('data-msec="waiting"','waiting','g-waiting','Waiting',cnt('waiting'))}${it('data-msec="someday"','someday','g-someday','Someday',cnt('someday'))}${it('data-msec="tickler"','tickler','g-tickler','Tickler',cnt('tickler'))}${it('data-msec="projects"','clip','g-projects','プロジェクト',projects().length)}</div>
   <div class="ph-sec row">エリア<span>${fs.length?`<button id="mFold">${anyOpen?'すべてたたむ':'すべて開く'}</button>`:''}<button id="mAddArea">追加</button></span></div>
   <div class="ph-ig">${areas||'<div class="ph-none ppad">エリアはまだありません</div>'}</div>
   <div class="ph-sec row">条件で絞ったリスト<span><button id="mAddView">追加</button></span></div>
   <div class="ph-ig">${(S.views||[]).map(v=>`<button class="ph-ir ic" data-mview="${v.id}"><span class="ph-ico g-view">${ic(v.icon||'filter')}</span><span class="l">${esc(v.name)}</span><span class="v">${vCount(v)||''}</span><span class="cv">${ic('chev')}</span></button>`).join('')||'<div class="ph-none ppad">「仕事エリア・職場・30分以内」のように、条件を組み合わせたリストを作れます。下のタブにも置けます。</div>'}</div>
   <div class="ph-sec">ふりかえり</div>
   <div class="ph-ig">${it('data-msec="review"','review','g-red','週次レビュー',rvAgo==null?'未実施':agoLabel(S.ui.lastReview),rvAgo==null||rvAgo>=7?'warn':'')}${it('data-msec="log"','log','g-gray','完了ログ',doneToday?'今日 '+doneToday:'')}${it('id="mTl"','cal','g-blue','今日のタイムライン','')}</div>
   <div class="ph-sec">下のタブ<small>Today と リスト のあいだの${tabN()-2}つ</small></div>
   <div class="ph-ig"><div class="ph-ir"><span class="l">ボタンの数</span><span class="ph-seg">${[5,6,7].map(n=>`<button data-tabn="${n}" class="${tabN()===n?'on':''}">${n}</button>`).join('')}</span></div>${tabSlots().map((k,i)=>{const s=slotInfo(k);return `<button class="ph-ir ic" data-tabslot="${i}">${s?(s.tico||s.pico):`<span class="ph-ico g-gray">${ic('plus')}</span>`}<span class="l">${s?esc(tabName(k,s)):'未設定'}${s&&tabNoLbl(k)?'<small>アイコンのみ</small>':''}</span><span class="v">${i+2}番目</span><span class="cv">${ic('chev')}</span></button>`}).join('')}</div>
   <div class="ph-sec">アプリ</div>
   <div class="ph-ig">${it('id="mSet"','palette','g-gray','デザイン','')}${it('id="mCfg"','gear','g-gray','設定','')}${it('id="mGuide"','book','g-gray','手引き','')}</div>
   ${S.sample?'<div class="ph-ig"><button class="ph-ir act del" id="mSample">サンプルを消去</button></div>':''}
  </div></div>`;
  $$('[data-msec]',el).forEach(b=>b.onclick=()=>{const s=b.dataset.msec;S.ui.section=s;F.area=null;if(s==='review'&&(S.ui.rvStep||0)>=RV.length-1)S.ui.rvStep=0;save();render()});
  $$('[data-marea]',el).forEach(b=>b.onclick=e=>{const tg=e.target.closest('[data-mtog]');if(tg){e.stopPropagation();S.ui.fold=S.ui.fold||{};S.ui.fold[tg.dataset.mtog]=!S.ui.fold[tg.dataset.mtog];save();renderMain();return}
    F.area=b.dataset.marea;S.ui.section='next';save();render()});
  const mf=$('#mFold',el);if(mf)mf.onclick=()=>{S.ui.fold=S.ui.fold||{};foldables().forEach(t=>{S.ui.fold[t.id]=anyOpen});save();renderMain()};
  $('#mAddArea',el).onclick=()=>{const a={id:uid(),name:'新しいエリア',color:COLORS[(S.areas.length*5)%28]};S.areas.push(a);save();renderMain();openAreaEditor(a)};
  $$('[data-tabslot]',el).forEach(b=>b.onclick=()=>openTabPicker(+b.dataset.tabslot));
  $$('[data-tabn]',el).forEach(b=>b.onclick=()=>{S.ui.tabN=+b.dataset.tabn;save();renderTabs();renderMain()});
  $$('[data-mview]',el).forEach(b=>b.onclick=()=>openView(b.dataset.mview));
  $('#mAddView',el).onclick=()=>openViewEditor(null,id=>{if(id)openView(id)});
  $('#mTl',el).onclick=()=>{if(!S.ui.tl)toggleTL()};
  $('#mSet',el).onclick=e=>{e.stopPropagation();openSettings($('#mSet',el))};
  $('#mCfg',el).onclick=e=>{e.stopPropagation();openConfig($('#mCfg',el))};
  $('#mGuide',el).onclick=()=>openGuide();
  const ms=$('#mSample',el);if(ms)ms.onclick=()=>{$('#side')&&renderSide();const cs=$('#clearSample');if(cs){cs.click();if(cs.classList.contains('armed')){ms.textContent='もう一度押すと消去します';ms.onclick=()=>{$('#clearSample').click();render()}}}};
}
function renderMain(){
  if(DR){const r=takeDraft();if(r){r.dr.el.remove();if(r.ok)save()}}
  const c=$('#content');let el=$('#view');
  if(!el){c.innerHTML='<div id="pads" class="pads" hidden></div><div id="view" class="view"></div>';el=$('#view');padSig=''}
  if(S.ui.section==='proj'&&!projMode()){S.ui.section='next'}
  if(S.ui.section==='sv'&&!curView())S.ui.section=narrow()?'more':'next';
  if(S.ui.section==='ag'&&!agMode())S.ui.section='next';
  if(S.ui.section==='pl'&&!plMode())S.ui.section='next';
  if(S.ui.section==='more'&&!narrow())S.ui.section='next';
  if(S.ui.section==='more')renderMore(el);else if(S.ui.section==='log')renderLog(el);else if(S.ui.section==='review')renderReview(el);else if(S.ui.section==='projects')renderProjects(el);else if(isList())renderList(el);else renderBoard(el);
  renderPads();bindPhScroll();document.body.dataset.sec=S.ui.section;
}
/* ---------- アイコンのバッジ（ホーム画面に追加したアプリ） ----------
   数 = 今日（と過ぎた未完了）のカレンダー予定 ＋ 締切が今日または過ぎている未完了タスク。
   設定は端末ごと（S.ui.badge）。iPhone ではホーム画面に追加し、通知を許可したときだけ表示される */
const badgeOK=()=>'setAppBadge' in navigator;
const badgeCount=()=>{const tk=todayKey();return S.tasks.filter(t=>!isProj(t)&&t.status!=='done'&&(t.status==='calendar'?calNow(t):!!t.due&&t.due<=tk)).length};
let lastBadge=-1;
function updBadge(force){if(!badgeOK())return;const n=S.ui.badge?badgeCount():0;if(n===lastBadge&&!force)return;lastBadge=n;
  try{(n?navigator.setAppBadge(n):navigator.clearAppBadge()).catch(()=>{})}catch(e){}}
async function setBadgeOn(on){
  if(!on){S.ui.badge=false;saveLocal();updBadge(true);return 'off'}
  if(!badgeOK())return 'unsupported';
  if('Notification' in window&&Notification.permission!=='granted'){
    let r='default';try{r=await Notification.requestPermission()}catch(e){}
    if(r!=='granted')return r==='denied'?'denied':'dismissed'}
  S.ui.badge=true;saveLocal();updBadge(true);return 'on'}
const badgeHint=()=>{if(!badgeOK())return 'この端末・ブラウザでは使えません。iPhone では Safari の共有メニューから「ホーム画面に追加」したアプリで使えます。';
  if(S.ui.badge&&'Notification' in window&&Notification.permission==='denied')return '通知が許可されていないため表示できません。iPhone の「設定 → 通知 → Fusen」で許可してください。';
  return '今日の予定と、締切が今日・過ぎているタスクの合計数をアプリのアイコンに表示します。この端末だけの設定です。'};
function render(){closePop();if(S.ui.section==='ag'&&!pName(S.ui.ag))S.ui.section='next';if(S.ui.section==='pl'&&!tagName(S.ui.pl))S.ui.section='next';if(S.ui.section==='sv'&&!curView())S.ui.section=narrow()?'more':'next';renderSide();renderBar();renderMain();renderTabs();if(S.ui.tl)renderTL();$('#tl').classList.toggle('open',S.ui.tl);updBadge()}

document.addEventListener('keydown',e=>{
  if((MAC?e.metaKey:e.ctrlKey)&&!e.altKey&&!e.shiftKey&&e.key.toLowerCase()==='k'){e.preventDefault();if($('#quick')){$('#quick .qk-t').focus();return}if($('.scrim')||$('#guide'))return;openQuick();return}
  if(e.target.closest('input,textarea,select')||$('.scrim')||$('#guide')||$('#cmp'))return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key.toLowerCase();
  if(listKeys(e,k))return;
  if(e.key==='?'){e.preventDefault();openGuide();return}
  if(e.key==='/'){e.preventDefault();openSearch();return}
  if(k==='n'){e.preventDefault();const pd=$('#pads .pad');if(pd&&!pd.closest('[hidden]')){const r=pd.getBoundingClientRect();pd.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,button:0,clientX:r.left+5,clientY:r.top+5}));window.dispatchEvent(new PointerEvent('pointerup',{clientX:r.left+5,clientY:r.top+5}))}}
  else if(k==='l'&&S.ui.section!=='log'){S.ui.view='list';save();render()}
  else if(k==='b'&&S.ui.section!=='log'){S.ui.view='board';save();render()}
  else if(k==='t')toggleTL();
  else if('1234567'.includes(k)&&k){S.ui.section=['inbox','today','next','calendar','waiting','someday','tickler'][+k-1];F.area=null;save();render()}
  else if(k==='='||k==='+')stepSize(1);else if(k==='-')stepSize(-1);
});
let wasNarrow=narrow();
window.addEventListener('resize',()=>{if(narrow()!==wasNarrow){wasNarrow=narrow();render();return}if(S.ui.tl)renderTL()});

/* iPhone：シート状の小窓の外をタップしたら、閉じるだけにして下の行を押さない */
document.addEventListener('pointerdown',e=>{if(!narrow())return;const op=$('.fpop,.setpop');if(!op||e.target.closest('.fpop,.setpop,.scrim'))return;
  const sw=ev=>{ev.stopPropagation();ev.preventDefault();window.removeEventListener('click',sw,true)};window.addEventListener('click',sw,true);setTimeout(()=>window.removeEventListener('click',sw,true),600)},true);
let VHINFO={};
/* iPhone / iPad のホーム画面アプリだけが対象。Mac の Safari で「Dock に追加」したアプリには適用しない */
const IOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const fixVH=()=>{const de=document.documentElement;const st=IOS&&(navigator.standalone===true||matchMedia('(display-mode: standalone)').matches);
  const sh=innerHeight>innerWidth?Math.max(screen.width,screen.height):Math.min(screen.width,screen.height);
  const gap=st?Math.round(sh-innerHeight):0;VHINFO={st,sh,ih:innerHeight,gap};
  /* 実機（画面852・表示領域793）で「補正 = ずれ − 45」がぴったりだったので、それを自動の既定値にする */
  const auto=gap>=40&&gap<=80?-45:0;const set=typeof S!=='undefined'&&S&&S.ui&&S.ui.vhAdj!=null&&S.ui.vhAdj!=='';
  const adj=set?+S.ui.vhAdj:auto;VHINFO.adj=adj;VHINFO.auto=!set;
  const g=Math.max(0,gap)+adj;if(st&&g>0&&g<220){de.classList.add('vh-fix');de.style.setProperty('--gap',g+'px')}else{de.classList.remove('vh-fix');de.style.removeProperty('--gap')}};
addEventListener('resize',fixVH);addEventListener('orientationchange',()=>setTimeout(fixVH,350));addEventListener('pageshow',fixVH);
load();if(purgeOld())save();fixVH();if(narrow())S.ui.tl=false;applyLook();$('#fab').innerHTML=ic('plus');$('#fab').onclick=openPlus;render();
setTimeout(()=>{$$('.due-b.back').forEach(e=>{const b=e.parentNode;e.remove();if(b&&b.classList.contains('badges')&&!b.children.length)b.remove()})},6100);
fbInit();
})();
</script>
